name: Code Quality Checks
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: AST 自定义扫描 (坏味道门禁, fail-fast)
        run: |
          python tools/ast_checker.py --quick

      - name: 路由契约扫描 (防空壳: 页面 fetch vs 路由注册, fail-fast)
        run: |
          python tools/page_api_lint.py
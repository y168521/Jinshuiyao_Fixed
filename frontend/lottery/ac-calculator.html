<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · AC值计算器</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
:root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-ac:var(--copper); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; max-width:800px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
.card h2 { font-size:15px; margin:0 0 12px; }
.flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
select,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
button { cursor:pointer; }
button.primary { background:var(--c-ac); color:var(--deep); border:none; font-weight:600; padding:5px 14px; }
button.primary:hover { opacity:.85; }
.muted { color:var(--muted); }
.num-grid { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.num-btn { width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--deep);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;transition:.15s; }
.num-btn:hover { border-color:var(--gold); }
.num-btn.selected { background:rgba(200,117,90,.2); border-color:var(--c-ac); color:var(--c-ac); }
.result-box { text-align:center; padding:20px; }
.result-box .val { font-size:48px; font-weight:800; color:var(--gold); }
.result-box .lbl { font-size:14px; color:var(--muted); margin-top:4px; }
.result-box .desc { font-size:13px; color:var(--ink-mid); margin-top:10px; max-width:500px; margin-left:auto; margin-right:auto; line-height:1.7; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:600px){ body{ padding:12px; } .num-btn{ width:36px;height:36px;font-size:12px; } .result-box .val{ font-size:36px; } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/lottery" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回彩票分析中心</a></div>
<h1>AC值计算器</h1>
<div class="sub">AC值 = 号码离散度 · 值越大号码分布越分散 · 常规范围 4~10</div>

<div class="card">
  <div class="flex" style="margin-bottom:10px">
    <select id="lotType" onchange="resetSelection()">
      <option value="ssq">双色球（选6个红球）</option>
      <option value="dlt">大乐透（选5个前区）</option>
      <option value="fc3d">福彩3D（选3个）</option>
      <option value="pl3">排列三（选3个）</option>
    </select>
    <span id="selectedCount" class="muted">已选 0 个</span>
    <button class="primary" onclick="calcAC()">计算AC值</button>
    <button onclick="randomPick()" style="background:var(--card);border-color:var(--gold)">随机选号</button>
  </div>
  <div class="num-grid" id="numGrid"></div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="result-box">
    <div class="val" id="acValue">—</div>
    <div class="lbl">AC值</div>
    <div class="desc" id="acDesc"></div>
  </div>
  <div class="detail-grid" id="detailGrid"></div>
</div>

<script>
const LOT_CFG = { ssq:{name:'双色球红球',range:33,pick:6}, dlt:{name:'大乐透前区',range:35,pick:5}, fc3d:{name:'福彩3D',range:10,pick:3}, pl3:{name:'排列三',range:10,pick:3} };
let selected = [];

function renderGrid(){
  const cfg = LOT_CFG[document.getElementById('lotType').value];
  let html = '';
  for(let i=1;i<=cfg.range;i++){
    const s = selected.includes(i)?' selected':'';
    html += `<div class="num-btn${s}" onclick="toggleNum(${i})">${String(i).padStart(2,'0')}</div>`;
  }
  document.getElementById('numGrid').innerHTML = html;
  document.getElementById('selectedCount').textContent = `已选 ${selected.length} 个（需选 ${cfg.pick} 个）`;
}

function toggleNum(n){
  const cfg = LOT_CFG[document.getElementById('lotType').value];
  const idx = selected.indexOf(n);
  if(idx>=0){ selected.splice(idx,1); }
  else if(selected.length<cfg.pick){ selected.push(n); }
  renderGrid();
}

function resetSelection(){ selected=[]; renderGrid(); document.getElementById('resultCard').style.display='none'; }

function randomPick(){
  const cfg = LOT_CFG[document.getElementById('lotType').value];
  selected = [];
  const pool = Array.from({length:cfg.range},(_,i)=>i+1);
  for(let i=0;i<cfg.pick;i++){ const r=Math.floor(Math.random()*pool.length); selected.push(pool[r]); pool.splice(r,1); }
  renderGrid();
  calcAC();
}

function calcAC(){
  const cfg = LOT_CFG[document.getElementById('lotType').value];
  if(selected.length!==cfg.pick){ alert(`请选择 ${cfg.pick} 个号码`); return; }
  const nums = [...selected].sort((a,b)=>a-b);
  const diffs = new Set();
  for(let i=0;i<nums.length;i++) for(let j=i+1;j<nums.length;j++) diffs.add(Math.abs(nums[i]-nums[j]));
  const ac = diffs.size - (cfg.pick-1);
  document.getElementById('resultCard').style.display='block';
  document.getElementById('acValue').textContent = ac;

  const descs = { low:'号码分布集中，常见于偏态组合', mid:'号码分布适中，属于正常范围', high:'号码分布分散，跨度较大' };
  let range;
  if(ac<=3) range='low';
  else if(ac<=8) range='mid';
  else range='high';
  document.getElementById('acDesc').textContent = `所选号码：${nums.join(', ')} | 差值组合：${diffs.size} 个 | AC值 = ${diffs.size} - (${cfg.pick}-1) = ${ac} | ${descs[range]}`;

  let detailHtml = `<div class="card"><h3>号码</h3><div style="display:flex;flex-wrap:wrap;gap:4px">`;
  nums.forEach(n=>{ detailHtml += `<span style="background:rgba(200,117,90,.15);color:var(--c-ac);padding:2px 10px;border-radius:6px;font-weight:700">${String(n).padStart(2,'0')}</span>`; });
  detailHtml += `</div></div><div class="card"><h3>差值组合（共 ${diffs.size} 个）</h3><div style="display:flex;flex-wrap:wrap;gap:4px">`;
  [...diffs].sort((a,b)=>a-b).forEach(d=>{ detailHtml += `<span style="background:var(--deep);border:1px solid var(--border);padding:2px 8px;border-radius:4px">${d}</span>`; });
  detailHtml += '</div></div>';
  document.getElementById('detailGrid').innerHTML = detailHtml;
}

renderGrid();
</script>
  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/topnav.js"></script>
</body>
</html>

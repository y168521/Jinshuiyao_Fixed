<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/tokens.css">
  <title>金水谣 · 奖金计算器</title>
  <style>
    /* 全站七色令牌派生（JS-20260924-26）。
       原 --accent/--gold/--ice 三个变量从未定义 → 页内 21 处 var() 全部失效，此处一并补齐。 */
    :root { --bg: var(--js-deep); --card: var(--js-card-bg); --text: var(--js-ink); --muted: var(--js-ink-mid); --border: var(--js-border-elev-0); --accent: var(--js-gold); --gold: var(--js-gold); --ice: var(--js-ice); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; min-height: 100vh; }
    .header { padding: 0.6rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .flex-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    select, input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.85rem; }
    select:focus, input:focus { outline: none; border-color: var(--accent); }
    .num-grid { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.5rem 0; }
    .num-btn { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 0.82rem; cursor: pointer; transition: all 0.15s; }
    .num-btn:hover { border-color: var(--accent); }
    .num-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .num-btn.blue { color: var(--ice); }
    .num-btn.blue.selected { background: var(--ice); color: #000; }
    .btn { padding: 0.45rem 1.2rem; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 0.88rem; cursor: pointer; transition: all 0.15s; }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .section-label { color: var(--muted); font-size: 0.82rem; margin: 1rem 0 0.4rem; }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; }
    .result-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; text-align: center; }
    .result-card .tier { font-size: 1.1rem; font-weight: 700; color: var(--gold); }
    .result-card .desc { font-size: 0.78rem; color: var(--muted); margin: 0.2rem 0; }
    .result-card .prize { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .result-card .count { font-size: 0.82rem; color: var(--ice); }
    .result-card.hit { border-color: var(--gold); }
    .prize-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 0.5rem; }
    .prize-table th { background: var(--border); color: var(--muted); padding: 0.4rem; text-align: center; font-weight: 500; }
    .prize-table td { padding: 0.35rem 0.4rem; text-align: center; border-bottom: 1px solid var(--border); }
    .prize-table .hit-row { background: rgba(255,217,61,0.05); }
    /* 表格窄屏兜底（JS-20260924-15）：本页未引 theme.css，共享兜底规则
       （theme.css 内 @media(max-width:768px) 的表格自滚）够不到，故页内补等价规则，
       与共享兜底行为一致。待本页接入 theme.css 后可删除本段。 */
    @media (max-width: 768px) {
      .prize-table { display: block; overflow-x: auto; white-space: nowrap; }
    }
    .prize-table .hit-row td { color: var(--gold); font-weight: 600; }
    .total-box { background: rgba(0,212,170,0.1); border: 1px solid var(--accent); border-radius: 8px; padding: 1rem; text-align: center; margin-top: 1rem; }
    .total-box .total { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .total-box .label { font-size: 0.82rem; color: var(--muted); }
    .hidden { display: none; }
    .match-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; background: rgba(0,212,170,0.15); color: var(--accent); }
    .note { color: var(--muted); font-size: 0.78rem; margin-top: 0.5rem; }
    @media (max-width: 768px) { .container { padding: 1rem; } .num-btn { width: 30px; height: 30px; font-size: 0.75rem; } }
  </style>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/ui-feedback.css">
<script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/ui-feedback.js"></script>
</head>
<body>
  <header class="header">
    <div><a href="/lottery" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回彩票分析中心</a></div>
    <h1>金水谣 · 奖金计算器</h1>
    <span style="color:var(--muted);font-size:0.85rem">选号对比 · 奖级估算</span>
  </header>
  <div class="container">
    <div id="rulesMeta" class="card hidden" style="border-left:3px solid var(--accent);padding:0.75rem 1rem;font-size:0.85rem;line-height:1.6"></div>
    <div class="card">
      <div class="card-title"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>选择彩种与号码</div>
      <div class="flex-row">
        <label style="color:var(--muted)">彩种</label>
        <select id="lotType" onchange="onLotTypeChange()">
          <option value="双色球">双色球</option>
          <option value="大乐透">大乐透</option>
          <option value="福彩3D">福彩3D</option>
          <option value="排列三">排列三</option>
          <option value="七乐彩">七乐彩</option>
          <option value="七星彩">七星彩</option>
          <option value="快乐8">快乐8</option>
        </select>
      </div>
      <div class="flex-row"><span style="color:var(--muted);font-size:0.82rem" id="myCount">我的号码: 0 个</span><button class="btn btn-sm" onclick="clearMyNums()">清空</button></div>
      <div id="myRedGrid" class="num-grid"></div>
      <div id="myBlueSection" class="hidden">
        <div class="flex-row"><span style="color:var(--muted);font-size:0.82rem" id="myBlueCount">蓝球: 0 个</span></div>
        <div id="myBlueGrid" class="num-grid"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span style="width:8px;height:8px;border-radius:50%;background:var(--gold)"></span>开奖号码</div>
      <div class="flex-row">
        <label style="color:var(--muted)">输入方式</label>
        <select id="drawInputMode" onchange="onDrawModeChange()">
          <option value="manual">手动输入</option>
          <option value="grid">点选号码</option>
        </select>
      </div>
      <div id="drawManual" class="flex-row">
        <label style="color:var(--muted)">开奖号码</label>
        <input type="text" id="drawInput" placeholder="例: 1,5,12,18,25,31+7" style="width:300px">
        <button class="btn btn-sm" onclick="parseDrawInput()">解析</button>
      </div>
      <div id="drawGrid" class="hidden">
        <div class="flex-row"><span style="color:var(--muted);font-size:0.82rem" id="drawCount">开奖: 0 个</span><button class="btn btn-sm" onclick="clearDrawNums()">清空</button></div>
        <div id="drawRedGrid" class="num-grid"></div>
        <div id="drawBlueSection" class="hidden">
          <div id="drawBlueGrid" class="num-grid"></div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="calcPrize()" style="margin-bottom:1rem">计算奖金</button>

    <div id="resultSection" class="hidden">
      <div class="card">
        <div class="card-title"><span style="width:8px;height:8px;border-radius:50%;background:var(--gold)"></span>中奖结果</div>
        <div id="matchSummary" style="margin-bottom:0.5rem"></div>
        <table class="prize-table" id="prizeTable"><thead><tr><th>奖级</th><th>条件</th><th>固定奖金</th><th>中奖注数</th><th>小计</th></tr></thead><tbody id="prizeBody"></tbody></table>
        <div class="total-box" id="totalBox"><div class="total" id="totalPrize">0</div><div class="label">合计奖金 (元)</div></div>
        <div class="note">注：一/二等奖为浮动奖，本页按官方公布的最低奖金估算；实际奖金以官方公告为准。<br>奖级与奖金均来自唯一真源 <code>config/lottery_prize_rules.json</code>（非本页硬编码），更新该 JSON 即全站生效。</div>
      </div>
      <div class="card">
        <div class="card-title"><span style="width:8px;height:8px;border-radius:50%;background:var(--ice)"></span>奖级速查表</div>
        <table class="prize-table" id="refTable"><thead><tr><th>奖级</th><th>条件</th><th>奖金</th></tr></thead><tbody id="refBody"></tbody></table>
      </div>
    </div>
  </div>

  <script>
    var LOT_CONFIG = {
      '双色球': { k: 6, bk: 1, redRange: [1,33], blueRange: [1,16], name: '双色球' },
      '大乐透': { k: 5, bk: 2, redRange: [1,35], blueRange: [1,12], name: '大乐透' },
      '福彩3D': { k: 3, bk: 0, redRange: [0,9], name: '福彩3D', digit: true },
      '排列三': { k: 3, bk: 0, redRange: [0,9], name: '排列三', digit: true },
      '七乐彩': { k: 7, bk: 0, redRange: [1,30], name: '七乐彩' },
      '七星彩': { k: 7, bk: 0, redRange: [0,9], name: '七星彩', seq: true },
      '快乐8': { k: 10, bk: 0, redRange: [1,80], name: '快乐8' },
    };

    // JS-20260924-34：官方奖级不再写死在前端，改为从后端唯一真源
    // config/lottery_prize_rules.json 拉取（见 /api/lottery/prize-rules）。
    // 改规则只需改那一个 JSON，本页与后端复盘同时生效。
    var PRIZE_TABLES = {};
    var RULES_META = { version: null, updated_at: null, source_note: null, staleness: null };

    function loadPrizeRules() {
      return fetch('/api/lottery/prize-rules')
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok || !j.rules) throw new Error((j && j.error) || '规则返回为空');
          PRIZE_TABLES = j.rules;
          RULES_META = {
            version: j.version || null,
            updated_at: j.updated_at || null,
            source_note: j.source_note || null,
            staleness: j.staleness || null
          };
          renderRulesMeta();
        })
        .catch(function (e) {
          PRIZE_TABLES = {};
          var el = document.getElementById('rulesMeta');
          if (el) {
            el.classList.remove('hidden');
            el.innerHTML = '<b>官方奖级规则加载失败（暂缺，不做猜测）</b><br>'
              + '<span style="opacity:.8">' + String(e && e.message || e) + '</span>';
          }
        });
    }

    function renderRulesMeta() {
      var el = document.getElementById('rulesMeta');
      if (!el) return;
      var st = RULES_META.staleness || {};
      var parts = [];
      parts.push('规则版本 ' + (RULES_META.version || '—') + '（更新于 ' + (RULES_META.updated_at || '—') + '）');
      if (st.is_stale) {
        el.classList.remove('hidden');
        el.style.borderLeftColor = 'var(--gold)';
        el.innerHTML = '<b>中奖规则已 ' + (st.days == null ? '未知天数' : st.days + ' 天') + '未核对</b><br>'
          + '<span style="opacity:.85">超过 ' + st.stale_days + ' 天请核对官方公告后更新 '
          + 'config/lottery_prize_rules.json（本系统不会自动改写规则）</span>';
        return;
      }
      el.classList.add('hidden');
      el.title = parts.join(' ');
    }

    var myReds = [], myBlues = [], drawReds = [], drawBlues = [];

    function onLotTypeChange() {
      var type = document.getElementById('lotType').value;
      renderGrids('my', type);
      renderGrids('draw', type);
      document.getElementById('resultSection').classList.add('hidden');
      myReds = []; myBlues = []; drawReds = []; drawBlues = [];
      updateAllCounts();
    }

    function renderGrids(prefix, type) {
      var cfg = LOT_CONFIG[type];
      if (!cfg) return;
      var redGrid = document.getElementById(prefix+'RedGrid');
      redGrid.innerHTML = '';
      for (var i = cfg.redRange[0]; i <= cfg.redRange[1]; i++) {
        var btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = i;
        btn.dataset.num = i;
        btn.dataset.prefix = prefix;
        btn.onclick = function() {
          var p = this.dataset.prefix;
          var n = parseInt(this.dataset.num);
          var arr = p === 'my' ? (document.querySelector('#myRedGrid .num-btn.blue') ? myReds : myReds) : drawReds;
          if (p === 'my') { toggleArr(myReds, n); } else { toggleArr(drawReds, n); }
          this.classList.toggle('selected');
          updateAllCounts();
        };
        redGrid.appendChild(btn);
      }
      if (cfg.blueRange) {
        var blueGrid = document.getElementById(prefix+'BlueGrid');
        var blueSection = document.getElementById(prefix+'BlueSection');
        if (blueSection) blueSection.classList.remove('hidden');
        if (blueGrid) {
          blueGrid.innerHTML = '';
          for (var i = cfg.blueRange[0]; i <= cfg.blueRange[1]; i++) {
            var btn = document.createElement('button');
            btn.className = 'num-btn blue';
            btn.textContent = i;
            btn.dataset.num = i;
            btn.dataset.prefix = prefix;
            btn.onclick = function() {
              var p = this.dataset.prefix;
              var n = parseInt(this.dataset.num);
              if (p === 'my') { toggleArr(myBlues, n); } else { toggleArr(drawBlues, n); }
              this.classList.toggle('selected');
              updateAllCounts();
            };
            blueGrid.appendChild(btn);
          }
        }
      }
    }

    function toggleArr(arr, n) {
      var idx = arr.indexOf(n);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(n);
    }

    function updateAllCounts() {
      document.getElementById('myCount').textContent = '我的号码: ' + myReds.length + ' 个';
      var mb = document.getElementById('myBlueCount');
      if (mb) mb.textContent = '蓝球: ' + myBlues.length + ' 个';
      document.getElementById('drawCount').textContent = '开奖: ' + drawReds.length + ' 个';
    }

    function clearMyNums() {
      myReds = []; myBlues = [];
      document.querySelectorAll('#myRedGrid .num-btn, #myBlueGrid .num-btn').forEach(function(b) { b.classList.remove('selected'); });
      updateAllCounts();
      document.getElementById('resultSection').classList.add('hidden');
    }

    function clearDrawNums() {
      drawReds = []; drawBlues = [];
      document.querySelectorAll('#drawRedGrid .num-btn, #drawBlueGrid .num-btn').forEach(function(b) { b.classList.remove('selected'); });
      updateAllCounts();
    }

    function onDrawModeChange() {
      var mode = document.getElementById('drawInputMode').value;
      document.getElementById('drawManual').classList.toggle('hidden', mode !== 'manual');
      document.getElementById('drawGrid').classList.toggle('hidden', mode !== 'grid');
    }

    function parseDrawInput() {
      var input = document.getElementById('drawInput').value.trim();
      if (!input) return;
      // Support formats: "1,5,12,18,25,31+7" or "1 5 12 18 25 31 7"
      var parts = input.split(/[+＋]/);
      var redParts = parts[0].split(/[,，\s]+/).filter(Boolean);
      drawReds = redParts.map(Number).filter(function(n) { return !isNaN(n); });
      if (parts.length > 1) {
        var blueParts = parts[1].split(/[,，\s]+/).filter(Boolean);
        drawBlues = blueParts.map(Number).filter(function(n) { return !isNaN(n); });
      } else {
        drawBlues = [];
      }
      // Update grid
      updateAllCounts();
      document.querySelectorAll('#drawRedGrid .num-btn').forEach(function(b) {
        var n = parseInt(b.dataset.num);
        b.classList.toggle('selected', drawReds.indexOf(n) >= 0);
      });
      document.querySelectorAll('#drawBlueGrid .num-btn').forEach(function(b) {
        var n = parseInt(b.dataset.num);
        b.classList.toggle('selected', drawBlues.indexOf(n) >= 0);
      });
    }

    function pad2(n) { return (n < 10 ? '0' : '') + String(n); }

    function buildNumStr(arr) { return arr.map(pad2).join(','); }

    function calcPrize() {
      var type = document.getElementById('lotType').value;
      var cfg = LOT_CONFIG[type];
      if (myReds.length < cfg.k) { JSY.toast('请至少选择 ' + cfg.k + ' 个号码'); return; }
      if (drawReds.length < cfg.k) { JSY.toast('请填写开奖号码'); return; }

      // JS-20260924-34：判定统一交给后端 utils.lottery_prize.judge_prize，
      // 前端只负责取号与展示（此前前端另写了一份按彩种硬编码的 if/else 匹配链，
      // 与后端口径各写各的，规则一改就两边不一致）。
      var myStr = buildNumStr(myReds) + (cfg.blueRange && myBlues.length ? '+' + buildNumStr(myBlues) : '');
      var drawStr = buildNumStr(drawReds) + (cfg.blueRange && drawBlues.length ? '+' + buildNumStr(drawBlues) : '');

      fetch('/api/lottery/prize-judge?lot=' + encodeURIComponent(type)
            + '&my=' + encodeURIComponent(myStr)
            + '&draw=' + encodeURIComponent(drawStr))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) throw new Error((j && j.error) || '判定失败');
          var res = j.result || {};

          // 命中概览始终显示「号码重合数」（与后端口径一致的 countHits 本地统计）
          var redHit = countHits(myReds, drawReds);
          var blueHit = cfg.blueRange ? countHits(myBlues, drawBlues) : 0;
          document.getElementById('matchSummary').innerHTML =
            '号码重合: <b>' + redHit + '/' + cfg.k + '</b>'
            + (cfg.blueRange ? ' | 后区重合: <b>' + blueHit + '/' + cfg.bk + '</b>' : '')
            + ' | 官方判定: <b>' + (res.status === 'win' ? (res.tier || '中奖') : prizeStatusText(res.status)) + '</b>';

          var tierResults = [];
          var totalPrize = 0;
          if (res.status === 'win') {
            var p = numericPrize(res.prize, res.tier, type);
            totalPrize = p;
            tierResults.push({
              tier: res.tier, cond: condOf(type, res.tier), count: 1,
              prize: p, subtotal: p, isFloat: isFloatPrize(res.prize)
            });
          }
          displayPrizeResult(tierResults, totalPrize, type, res.status);
        })
        .catch(function (e) {
          JSY.toast('官方奖级判定失败: ' + String(e && e.message || e));
        });
    }

    function prizeStatusText(status) {
      if (status === 'lose') return '未中奖';
      if (status === 'not_applicable') return '暂缺（该玩法套不上官方奖级）';
      return '暂缺（规则读不到）';
    }

    function isFloatPrize(prize) { return !(typeof prize === 'number'); }

    function numericPrize(prize, tier, type) {
      if (typeof prize === 'number') return prize;
      var t = (PRIZE_TABLES[type] || []).filter(function (x) { return x.tier === tier; })[0];
      return t && typeof t.min === 'number' ? t.min : 0;
    }

    function condOf(type, tier) {
      var t = (PRIZE_TABLES[type] || []).filter(function (x) { return x.tier === tier; })[0];
      return t ? (t.cond || '') : '';
    }

    function countHits(a, b) {
      var hits = 0;
      for (var i = 0; i < a.length; i++) {
        if (b.indexOf(a[i]) >= 0) hits++;
      }
      return hits;
    }

    function displayPrizeResult(tierResults, totalPrize, type, status) {
      var section = document.getElementById('resultSection');
      section.classList.remove('hidden');

      var body = document.getElementById('prizeBody');
      body.innerHTML = '';
      if (tierResults.length === 0) {
        // 诚实区分：未中奖 与 规则套不上/读不到，不能都写成「未中奖」
        body.innerHTML = '<tr><td colspan="5" style="color:var(--muted);padding:1rem">'
          + (status ? prizeStatusText(status) : '未中奖') + '</td></tr>';
      } else {
        tierResults.forEach(function(r) {
          var tr = document.createElement('tr');
          tr.className = 'hit-row';
          tr.innerHTML = '<td>' + r.tier + (r.isFloat ? '*':'') + '</td><td>' + (r.cond||'') + '</td><td>' + (r.isFloat ? r.prize.toLocaleString()+'起': r.prize.toLocaleString() ) + '</td><td>' + r.count + '</td><td>' + r.subtotal.toLocaleString() + '</td>';
          body.appendChild(tr);
        });
      }
      document.getElementById('totalPrize').textContent = totalPrize.toLocaleString();

      // Reference table（奖级表来自后端规则真源，不再是前端硬编码）
      var refBody = document.getElementById('refBody');
      var prizeTable = PRIZE_TABLES[type] || [];
      refBody.innerHTML = '';
      if (prizeTable.length === 0) {
        refBody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);padding:1rem">奖级表暂缺（规则未加载）</td></tr>';
        return;
      }
      prizeTable.forEach(function(t) {
        var tr = document.createElement('tr');
        var prizeTxt = (typeof t.prize === 'number')
          ? t.prize.toLocaleString()
          : String(t.prize || '—') + (t.min ? ' (' + t.min.toLocaleString() + '起)' : '');
        tr.innerHTML = '<td>' + t.tier + '</td><td>' + (t.cond || '') + '</td><td>' + prizeTxt + '</td>';
        refBody.appendChild(tr);
      });
    }

    // Init：先拉官方奖级规则，再渲染号码盘
    onLotTypeChange();
    loadPrizeRules().then(function () { onLotTypeChange(); });
  </script>

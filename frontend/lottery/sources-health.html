<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 彩票数据源健康仪表盘</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim);
          --c-ok:var(--ok); --c-warn:var(--warn); --bad:var(--err); --half:var(--ice); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .b-closed { background:rgba(34,197,94,.15); color:var(--c-ok); }
  .b-open { background:rgba(239,68,68,.15); color:var(--bad); }
  .b-half_open { background:rgba(59,130,246,.15); color:var(--half); }
  .b-stale { background:rgba(239,68,68,.15); color:var(--bad); }
  .b-fresh { background:rgba(34,197,94,.12); color:var(--c-ok); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--c-ok); animation:p 1.6s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.3} }
  .err { color:var(--bad); font-size:13px; }
  .muted { color:var(--muted); }
  .scroll-x { overflow-x:auto; }
  @media(max-width:600px){ body{ padding:12px; } .card{ padding:12px; } }
</style>
</head>
<body>
  <div style="margin-bottom:10px;"><a href="/lottery" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回彩票分析中心</a></div>
  <div class="topbar">
    <div><h1>彩票数据源健康仪表盘</h1><div class="sub">熔断状态 · 成功/失败时间戳 · 数据新鲜度 — 每 15 秒自动刷新</div></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="pulse" id="pulse"></span><span class="muted" id="ts">—</span></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>📊 数据源熔断状态</h2>
      <div class="scroll-x"><table><thead><tr><th>数据源</th><th>状态</th><th>连续失败</th><th>成功/失败</th><th>最近失败</th></tr></thead>
      <tbody id="srcBody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody></table></div>
    </div>
    <div class="card">
      <h2>🗄️ 各彩种数据新鲜度</h2>
      <table><thead><tr><th>彩种</th><th>数据年龄</th><th>状态</th></tr></thead>
      <tbody id="lotBody"><tr><td colspan="3" class="muted">加载中…</td></tr></tbody></table>
    </div>
  </div>
  <div id="errBox"></div>

<script>
function fmtTs(t){ if(!t) return '—'; const d=new Date(t*1000); return d.toLocaleTimeString('zh-CN',{hour12:false}); }
function ageStr(m){ if(m===null||m===undefined) return '无数据'; if(m<60) return m+' 分钟'; if(m<1440) return Math.floor(m/60)+' 小时'; return Math.floor(m/1440)+' 天'; }
async function refresh(){
  try{
    const r = await fetch('/api/lottery/sources-health', {cache:'no-store'});
    const j = await r.json();
    document.getElementById('errBox').innerHTML = '';
    if(!j.ok){ document.getElementById('errBox').innerHTML = '<p class="err">接口返回错误：'+(j.error||'')+'</p>'; return; }
    // sources
    const sb = document.getElementById('srcBody');
    if(!j.sources || !j.sources.length){ sb.innerHTML = '<tr><td colspan="5" class="muted">暂无源活动记录（抓取尚未运行）</td></tr>'; }
    else{
      sb.innerHTML = j.sources.map(s=>{
        const cls = s.state==='closed'?'b-closed':(s.state==='open'?'b-open':'b-half_open');
        const label = s.state==='closed'?'正常':(s.state==='open'?'已熔断':'半开探测');
        return `<tr><td>${s.source}</td><td><span class="badge ${cls}">${label}</span></td>`+
               `<td>${s.failure_count}</td><td>${s.total_success}/${s.total_failure}</td>`+
               `<td class="muted">${fmtTs(s.last_failure)}</td></tr>`;
      }).join('');
    }
    // lotteries
    const lb = document.getElementById('lotBody');
    lb.innerHTML = j.lotteries.map(l=>{
      const stale = l.stale;
      return `<tr><td>${l.name}</td><td>${ageStr(l.data_age_min)}</td>`+
             `<td><span class="badge ${stale?'b-stale':'b-fresh'}">${stale?'陈旧':'新鲜'}</span></td></tr>`;
    }).join('');
    document.getElementById('ts').textContent = '更新于 '+new Date(j.generated_at*1000).toLocaleTimeString('zh-CN',{hour12:false});
  }catch(e){
    document.getElementById('errBox').innerHTML = '<p class="err">刷新失败：'+e+'（server 可能未启动）</p>';
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>

.chart-wrap canvas { width: 100%; height: 350px; display: block; }
.num-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.num-cell { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: transform .15s; cursor: default; }
.num-cell:hover { transform: scale(1.15); }
.num-cell.hot { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-border); }
.num-cell.cold { background: var(--ice-soft); color: var(--ice); border: 1px solid rgba(91,192,222,.18); }
.num-cell.normal { background: rgba(232,236,241,.04); color: var(--ink-mid); border: 1px solid rgba(232,236,241,.06); }
.num-cell.never { background: transparent; color: var(--ink-dim); border: 1px dashed rgba(232,236,241,.08); opacity: .4; }
#pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
#pagination .page-btn { padding: 6px 14px; border: 1px solid var(--gold-border); border-radius: var(--radius-sm); background: transparent; color: var(--ink-mid); cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; }

#pagination .page-btn.active { background: var(--gold); color: var(--deep); border-color: var(--gold); }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 13px; font-weight: 500; }
.chart-tip { position: absolute; pointer-events: none; opacity: 0; background: var(--deep); border: 1px solid var(--gold-border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; color: var(--ink); z-index: 10; white-space: nowrap; transition: opacity .15s; box-shadow: var(--shadow); }

function setupCanvas(id, heightRatio) {
  const canvas = document.getElementById(id);
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(rect.width);
  const h = Math.floor(Math.max(200, Math.min(500, w * (heightRatio || 0.45))));
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w, h, canvas };
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function drawDistChart(id, nums, freq, miss, barColor) {
  const { ctx, w, h } = setupCanvas(id, 0.38);
  const pad = { top: 38, bottom: 32, left: 44, right: 44 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const n = nums.length;
  if (n === 0) return;

  const maxFreq = Math.max(...freq, 1);
  const maxMiss = Math.max(...miss, 1);
  const barW = Math.min(cw / n * 0.65, 28);
  const gap = cw / n;

  // background
  ctx.clearRect(0, 0, w, h);

  // grid lines
  ctx.strokeStyle = THEME.goldBorder;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // y-axis labels (left)
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    const val = Math.round(maxFreq - (maxFreq / gridLines) * i);
    ctx.fillText(val, pad.left - 8, y);
  }

  // y-axis labels (right - miss)
  ctx.textAlign = 'left';
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    const val = Math.round(maxMiss - (maxMiss / gridLines) * i);
    ctx.fillText(val, w - pad.right + 6, y);
  }

  // y-axis title (left)
  ctx.save();
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('次数', pad.left - 2, pad.top - 6);
  ctx.restore();

  // y-axis title (right)
  ctx.save();
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('遗漏', w - pad.right + 2, pad.top - 6);
  ctx.restore();

  // bars
  const barSpace = gap * 0.65;
  nums.forEach((num, i) => {
    const x = pad.left + i * gap + (gap - barSpace) / 2;
    const f = freq[i];
    const barH = (f / maxFreq) * ch;
    const grad = ctx.createLinearGradient(x, pad.top + ch - barH, x, pad.top + ch);
    grad.addColorStop(0, barColor);
    grad.addColorStop(1, hexToRgba(barColor, 0.3));
    ctx.fillStyle = grad;
    ctx.beginPath();
    const r = Math.min(barSpace * 0.15, 3);
    const bx = x, by = pad.top + ch - barH, bw = barSpace, bh = barH;
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh);
    ctx.lineTo(bx, by + bh);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.fill();
  });

  // x-axis labels (show every few)
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '9px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const step = n > 25 ? Math.ceil(n / 15) : 1;
  nums.forEach((num, i) => {
    if (i % step === 0) {
      ctx.fillText(String(num), pad.left + i * gap + gap / 2, pad.top + ch + 6);
    }
  });

  // line (miss)
  ctx.beginPath();
  nums.forEach((num, i) => {
    const x = pad.left + i * gap + gap / 2;
    const y = pad.top + ch - (miss[i] / maxMiss) * ch;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = THEME.copper;
  ctx.lineWidth = 2;
  ctx.stroke();

  // line dots
  nums.forEach((num, i) => {
    const x = pad.left + i * gap + gap / 2;
    const y = pad.top + ch - (miss[i] / maxMiss) * ch;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = THEME.copper;
    ctx.fill();
  });

  // legend
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'top';
  const legY = 8;
  const items = [
    { label: '出现次数', color: barColor, type: 'rect' },
    { label: '当前遗漏', color: THEME.copper, type: 'line' },
  ];
  let lx = pad.left;
  items.forEach(item => {
    ctx.fillStyle = THEME.inkMid;
    if (item.type === 'rect') {
      ctx.fillStyle = item.color;
      ctx.fillRect(lx, legY + 3, 14, 10);
    } else {
      ctx.strokeStyle = item.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lx, legY + 8);
      ctx.lineTo(lx + 14, legY + 8);
      ctx.stroke();
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.arc(lx + 7, legY + 8, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = THEME.inkMid;
    ctx.textAlign = 'left';
    ctx.fillText(item.label, lx + 20, legY);
    lx += ctx.measureText(item.label).width + 36;
  });

  // tooltip
  const tip = document.getElementById('tip' + id.replace('chart', ''));
  if (tip) {
    const canvas = document.getElementById(id);
    canvas.onmousemove = function(e) {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const idx = Math.round((mx - pad.left) / gap - 0.5);
      if (idx >= 0 && idx < n) {
        tip.style.opacity = '1';
        tip.style.left = (pad.left + idx * gap + gap / 2) + 'px';
        tip.style.top = '0px';
        tip.textContent = '号 ' + nums[idx] + ' · 出现 ' + freq[idx] + ' 次 · 遗漏 ' + miss[idx] + ' 期';
      } else {
        tip.style.opacity = '0';
      }
    };
    canvas.onmouseleave = function() { tip.style.opacity = '0'; };
  }
}

function drawTrendChart(id, periods, heads, tails) {
  const { ctx, w, h } = setupCanvas(id, 0.42);
  const pad = { top: 36, bottom: 36, left: 44, right: 20 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const n = periods.length;
  if (n === 0) return;

  const allVals = [...heads, ...tails];
  const yMin = Math.max(0, Math.min(...allVals) - 2);
  const yMax = Math.max(...allVals) + 2;
  const yRange = yMax - yMin || 1;

  ctx.clearRect(0, 0, w, h);

  // grid
  ctx.strokeStyle = THEME.goldBorder;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // y labels
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '9px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    const val = Math.round(yMax - (yRange / gridLines) * i);
    ctx.fillText(val, pad.left - 8, y);
  }

  // x labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const step = n > 20 ? Math.ceil(n / 12) : 1;
  periods.forEach((p, i) => {
    if (i % step === 0) {
      ctx.save();
      ctx.translate(pad.left + (i / (n - 1 || 1)) * cw, pad.top + ch + 6);
      ctx.rotate(-Math.PI / 6);
      ctx.fillStyle = THEME.inkDim;
      ctx.font = '8px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(p, 0, 0);
      ctx.restore();
    }
  });

  function drawLine(data, color, fill) {
    const points = [];
    data.forEach((val, i) => {
      const x = pad.left + (i / (n - 1 || 1)) * cw;
      const y = pad.top + ch - ((val - yMin) / yRange) * ch;
      points.push({ x, y });
    });

    // area fill
    if (fill) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, pad.top + ch);
      points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(points[n - 1].x, pad.top + ch);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
      grad.addColorStop(0, hexToRgba(color, 0.2));
      grad.addColorStop(1, hexToRgba(color, 0.02));
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // line
    ctx.beginPath();
    points.forEach((p, i) => {
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // dots
    points.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = THEME.deep;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  drawLine(heads, THEME.gold, true);
  drawLine(tails, THEME.ice, true);

  // legend
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'top';
  const legY = 8;
  const items = [
    { label: '龙头', color: THEME.gold },
    { label: '凤尾', color: THEME.ice },
  ];
  let lx = pad.left;
  items.forEach(item => {
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(lx, legY + 8);
    ctx.lineTo(lx + 18, legY + 8);
    ctx.stroke();
    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(lx + 9, legY + 8, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = THEME.inkMid;
    ctx.textAlign = 'left';
    ctx.fillText(item.label, lx + 24, legY);
    lx += ctx.measureText(item.label).width + 42;
  });

  if (id === 'chartTrend') {
    const tip = document.getElementById('tipTrend');
    if (tip) {
      const canvas = document.getElementById(id);
      canvas.onmousemove = function(e) {
        const r = canvas.getBoundingClientRect();
        const mx = e.clientX - r.left;
        const i = Math.round(((mx - pad.left) / cw) * (n - 1));
        if (i >= 0 && i < n) {
          tip.style.opacity = '1';
          tip.style.left = Math.min(Math.max(pad.left + (i / (n - 1 || 1)) * cw, 10), w - 120) + 'px';
          tip.style.top = '0px';
          tip.textContent = periods[i] + ' · 龙头 ' + heads[i] + ' · 凤尾 ' + tails[i];
        } else {
          tip.style.opacity = '0';
        }
      };
      canvas.onmouseleave = function() { tip.style.opacity = '0'; };
    }
  }
}

function drawDiffChart(id, periods, diffs, avg) {
  const { ctx, w, h } = setupCanvas(id, 0.35);
  const pad = { top: 36, bottom: 36, left: 44, right: 20 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const n = periods.length;
  if (n === 0) return;

  const yMin = Math.max(0, Math.min(...diffs) - 2);
  const yMax = Math.max(...diffs) + 2;
  const yRange = yMax - yMin || 1;

  ctx.clearRect(0, 0, w, h);

  // grid
  ctx.strokeStyle = THEME.goldBorder;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // y labels
  ctx.fillStyle = THEME.inkDim;
  ctx.font = '9px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.top + (ch / gridLines) * i;
    const val = Math.round(yMax - (yRange / gridLines) * i);
    ctx.fillText(val, pad.left - 8, y);
  }

  // x labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const step = n > 20 ? Math.ceil(n / 12) : 1;
  periods.forEach((p, i) => {
    if (i % step === 0) {
      ctx.save();
      ctx.translate(pad.left + (i / (n - 1 || 1)) * cw, pad.top + ch + 6);
      ctx.rotate(-Math.PI / 6);
      ctx.fillStyle = THEME.inkDim;
      ctx.font = '8px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(p, 0, 0);
      ctx.restore();
    }
  });

  // avg line
  const avgY = pad.top + ch - ((avg - yMin) / yRange) * ch;
  ctx.strokeStyle = THEME.copper;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, avgY);
  ctx.lineTo(w - pad.right, avgY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = THEME.copper;
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('均值 ' + avg.toFixed(1), w - pad.right - 60, avgY - 4);

  // bars
  const barW = Math.min(cw / n * 0.55, 20);
  diffs.forEach((val, i) => {
    const x = pad.left + (i / (n - 1 || 1)) * cw - barW / 2;
    const barH = ((val - yMin) / yRange) * ch;
    const y = pad.top + ch - barH;
    const grad = ctx.createLinearGradient(x, y, x, pad.top + ch);
    grad.addColorStop(0, THEME.jade);
    grad.addColorStop(1, hexToRgba(THEME.jade, 0.2));
    ctx.fillStyle = grad;
    const r = Math.min(barW * 0.2, 3);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + barW - r, y);
    ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx.lineTo(x + barW, pad.top + ch);
    ctx.lineTo(x, pad.top + ch);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
  });

  // legend
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = THEME.jade;
  ctx.fillRect(pad.left, 11, 14, 10);
  ctx.fillStyle = THEME.inkMid;
  ctx.textAlign = 'left';
  ctx.fillText('头尾差', pad.left + 20, 8);
  const lx = pad.left + ctx.measureText('头尾差').width + 40;
  ctx.strokeStyle = THEME.copper;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(lx, 16);
  ctx.lineTo(lx + 18, 16);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = THEME.inkMid;
  ctx.fillText('均值', lx + 24, 8);

  const tip = document.getElementById('tipDiff');
  if (tip) {
    const canvas = document.getElementById(id);
    canvas.onmousemove = function(e) {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const i = Math.round(((mx - pad.left) / cw) * (n - 1));
      if (i >= 0 && i < n) {
        tip.style.opacity = '1';
        tip.style.left = Math.min(Math.max(pad.left + (i / (n - 1 || 1)) * cw, 10), w - 120) + 'px';
        tip.style.top = '0px';
        tip.textContent = periods[i] + ' · 头尾差 ' + diffs[i];
      } else {
        tip.style.opacity = '0';
      }
    };
    canvas.onmouseleave = function() { tip.style.opacity = '0'; };
  }
}

function renderHotCold(containerId, freq, maxNum) {
  const el = document.getElementById(containerId);
  const vals = Object.values(freq);
  const sorted = [...vals].sort((a, b) => a - b);
  const lo = sorted[Math.floor(sorted.length * 0.25)] || 0;
  const hi = sorted[Math.ceil(sorted.length * 0.75)] || 1;
  let html = '';
  for (let i = 1; i <= maxNum; i++) {
    const f = freq[i] || 0;
    let cls = 'normal';
    if (f === 0) cls = 'never';
    else if (f >= hi) cls = 'hot';
    else if (f <= lo) cls = 'cold';
    html += '<span class="num-cell ' + cls + '">' + i + '</span>';
  }
  el.innerHTML = html;
}

function renderDataTable(data, type) {
  const pageSize = 15;
  let page = 1;
  const totalPages = Math.ceil(data.length / pageSize);
  const tbody = document.getElementById('dataBody');

  function showPage(p) {
    const start = (p - 1) * pageSize;
    const end = Math.min(start + pageSize, data.length);
    const slice = data.slice(start, end);
    let html = '';
    slice.forEach(d => {
      const h = headOf(d);
      const t = tailOf(d);
      const frontLen = type === 'ssq' ? 6 : 5;
      const front = d.n.slice(0, frontLen).map(v => '<span class="num red">' + v + '</span>').join('');
      const back = d.n.slice(frontLen).map(v => '<span class="num blue">' + v + '</span>').join('');
      html += '<tr><td>' + d.p + '</td><td>' + front + (back ? ' ' + back : '') + '</td>'
        + '<td><span class="num gold">' + h + '</span></td>'
        + '<td><span class="num gold">' + t + '</span></td>'
        + '<td>' + (t - h) + '</td></tr>';
    });
    tbody.innerHTML = html;
    renderPagination(p, totalPages);
  }

  window.showDataPage = showPage;
  showPage(1);
}

function renderPagination(current, total) {
  const el = document.getElementById('pagination');
  let html = '';
  const range = 2;
  if (total <= 1) { el.innerHTML = ''; return; }
  if (current > 1) {
    html += '<button class="page-btn" onclick="showDataPage(' + (current - 1) + ')">‹</button>';
  }
  for (let i = Math.max(1, current - range); i <= Math.min(total, current + range); i++) {
    html += '<button class="page-btn' + (i === current ? ' active' : '') + '" onclick="showDataPage(' + i + ')">' + i + '</button>';
  }
  if (current < total) {
    html += '<button class="page-btn" onclick="showDataPage(' + (current + 1) + ')">›</button>';
  }
  el.innerHTML = html;
}

function compute() {
  const data = getData();
  const type = document.getElementById('lotType').value;
  const maxNum = type === 'ssq' ? 33 : 35;

  const headFreq = {}, tailFreq = {};
  for (let i = 1; i <= maxNum; i++) { headFreq[i] = 0; tailFreq[i] = 0; }

  let headSum = 0, tailSum = 0;
  const lastHeadPos = {}, lastTailPos = {};
  for (let i = 1; i <= maxNum; i++) { lastHeadPos[i] = -1; lastTailPos[i] = -1; }

  data.forEach((d, idx) => {
    const h = headOf(d);
    const t = tailOf(d);
    headFreq[h] = (headFreq[h] || 0) + 1;
    tailFreq[t] = (tailFreq[t] || 0) + 1;
    headSum += h;
    tailSum += t;
    lastHeadPos[h] = idx;
    lastTailPos[t] = idx;
  });

  const headMiss = {}, tailMiss = {};
  for (let i = 1; i <= maxNum; i++) {
    headMiss[i] = lastHeadPos[i] === -1 ? data.length : data.length - 1 - lastHeadPos[i];
    tailMiss[i] = lastTailPos[i] === -1 ? data.length : data.length - 1 - lastTailPos[i];
  }

  let mostH = 1, mostT = 1, coldH = 1, coldT = 1;
  for (let i = 2; i <= maxNum; i++) {
    if (headFreq[i] > headFreq[mostH]) mostH = i;
    if (tailFreq[i] > tailFreq[mostT]) mostT = i;
    if (headMiss[i] > headMiss[coldH]) coldH = i;
    if (tailMiss[i] > tailMiss[coldT]) coldT = i;
  }

  document.getElementById('mostHead').textContent = mostH;
  document.getElementById('mostTail').textContent = mostT;
  document.getElementById('coldHead').textContent = coldH;
  document.getElementById('coldTail').textContent = coldT;
  document.getElementById('avgHead').textContent = (headSum / data.length).toFixed(1);
  document.getElementById('avgTail').textContent = (tailSum / data.length).toFixed(1);

  const nums = Array.from({ length: maxNum }, (_, i) => i + 1);
  const hfArr = nums.map(n => headFreq[n]);
  const tfArr = nums.map(n => tailFreq[n]);
  const hmArr = nums.map(n => headMiss[n]);
  const tmArr = nums.map(n => tailMiss[n]);

  drawDistChart('chartHead', nums, hfArr, hmArr, THEME.gold);
  drawDistChart('chartTail', nums, tfArr, tmArr, THEME.ice);
  renderHotCold('headHot', headFreq, maxNum);
  renderHotCold('tailHot', tailFreq, maxNum);

  const reversed = data.slice().reverse();
  const periods = reversed.map(d => d.p);
  const heads = reversed.map(d => headOf(d));
  const tails = reversed.map(d => tailOf(d));
  const diffs = reversed.map(d => tailOf(d) - headOf(d));
  const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;

  drawTrendChart('chartTrend', periods, heads, tails);
  drawDiffChart('chartDiff', periods, diffs, avg);

  renderDataTable(data, type);
}

function switchTab(tab, tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById(tabId).classList.add('active');
  setTimeout(redrawAll, 80);
}

let redrawTimer = null;
function redrawAll() {
  if (redrawTimer) return;
  redrawTimer = setTimeout(function() {
    redrawTimer = null;
    compute();
  }, 50);
}

function onChange() {
  compute();
}

window.addEventListener('resize', redrawAll);

document.addEventListener('DOMContentLoaded', function() {
  compute();
});

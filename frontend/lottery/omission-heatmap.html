<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金水谣 · 遗漏热力图</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --primary: #00d4aa;
      --danger: #ff6b6b;
      --gold: #ffd93d;
      --blue: #60a5fa;
      --text: #e4e8f1;
      --muted: #7a8499;
      --border: #1e2a40;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
    }
    .header {
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header .time { color: var(--muted); font-size: 0.85rem; }
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 0.7rem 1.2rem;
      font-size: 0.88rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
    .panel { display: none; }
    .panel.active { display: block; }
    .toolbar {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .toolbar label { color: var(--muted); font-size: 0.85rem; }
    .btn-group { display: flex; gap: 0; }
    .btn {
      padding: 0.35rem 0.8rem;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:first-child { border-radius: 4px 0 0 4px; }
    .btn:last-child { border-radius: 0 4px 4px 0; }
    .btn:not(:last-child) { border-right: none; }
    .btn:hover { background: rgba(255,255,255,0.05); }
    .btn.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 600; }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .chart-card .title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chart-box { width: 100%; min-height: 500px; }
    .chart-box-short { min-height: 300px; }
    .legend-layer {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 0.5rem 0;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; }
    .legend-dot.layer-1 { background: #163040; }
    .legend-dot.layer-2 { background: #1a5c4a; }
    .legend-dot.layer-3 { background: #2d5e8a; }
    .legend-dot.layer-4 { background: #8a3a3a; }
    .legend-dot.appear { background: #00d4aa; }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .stats-table th {
      background: var(--border);
      color: var(--muted);
      padding: 0.4rem 0.5rem;
      text-align: center;
      font-weight: 500;
    }
    .stats-table td {
      padding: 0.35rem 0.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .stats-table tr:hover td { background: rgba(255,255,255,0.03); }
    .num-cell { font-weight: 600; color: var(--primary); }
    .stats-val { font-family: 'Consolas', monospace; }
    .miss-high { color: var(--danger); font-weight: 600; }
    .miss-mid { color: var(--gold); }
    .miss-low { color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
    }
    .badge-appear { background: rgba(0,212,170,0.2); color: var(--primary); }
    .badge-hot { background: rgba(255,107,107,0.15); color: var(--danger); }
    .badge-warm { background: rgba(255,217,61,0.15); color: var(--gold); }
    .badge-cold { background: rgba(96,165,250,0.15); color: var(--blue); }
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .chart-box { min-height: 350px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div><a href="/lottery" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回彩票分析中心</a></div>
    <h1>金水谣 · 遗漏热力图</h1>
    <span class="time" id="updateTime"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="container" id="panels"></div>
  <script src="/Jinshuiyao_Fixed/frontend/trend/trend-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/jinshuiyao-echarts-theme.js"></script>
  <script>
    var data = window.TREND_DATA;
    if (!data) {
      document.getElementById('panels').innerHTML = '<p style="padding:2rem;color:#7a8499">暂无走势数据，请先运行预测系统生成数据</p>';
      document.getElementById('updateTime').textContent = '无数据';
    } else {
      var now = new Date();
      document.getElementById('updateTime').textContent = '更新: ' + now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      renderAll();
    }

    function renderAll() {
      var tabsEl = document.getElementById('tabs');
      var panelsEl = document.getElementById('panels');
      var lotNames = Object.keys(data).sort(function(a,b){ return a.localeCompare(b); });
      var priority = ['福彩3D','排列三','双色球','大乐透','七乐彩','七星彩','快乐8'];
      lotNames.sort(function(a,b){ return priority.indexOf(a)-priority.indexOf(b); });

      lotNames.forEach(function(name, idx) {
        var tab = document.createElement('div');
        tab.className = 'tab' + (idx===0?' active':'');
        tab.textContent = name;
        tab.dataset.idx = idx;
        tab.onclick = function() {
          var ci = parseInt(this.dataset.idx);
          document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
          document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
          this.classList.add('active');
          document.getElementById('panel-'+ci).classList.add('active');
        };
        tabsEl.appendChild(tab);

        var panel = document.createElement('div');
        panel.className = 'panel' + (idx===0?' active':'');
        panel.id = 'panel-'+idx;
        panelsEl.appendChild(panel);
        buildOmissionPanel(panel, name, data[name]);
      });

      // Image download (all panels)
      lotNames.forEach(function(name) {
        downloadPNG(document.querySelector('#panel-'+lotNames.indexOf(name)+' .download-btn'), name);
      });
    }

    function buildOmissionPanel(panel, name, d) {
      var isDigit = name === '福彩3D' || name === '排列三';
      var periodRange = isDigit ? getMissMatrix(d, 30) : getMissMatrixBig(name, d, 30);
      // Default to 30 periods, store in dataset
      panel.dataset.missCache = JSON.stringify({digit: isDigit, data: d});

      var html = '';
      html += '<div class="toolbar">';
      html += '<label>分析期数:</label><div class="btn-group" id="rangeBtns-'+name+'">';
      [30,50,100,200].forEach(function(n) {
        html += '<button class="btn'+(n===30?' active':'')+'" data-range="'+n+'" onclick="changeRange(\''+name+'\','+n+')">'+n+'期</button>';
      });
      html += '</div>';
      html += '<button class="btn download-btn" data-name="'+name+'" style="margin-left:auto;border-radius:4px">下载图片</button>';
      html += '</div>';

      html += '<div class="legend-layer">';
      html += '<span class="legend-item"><span class="legend-dot appear"></span> 本期出现</span>';
      html += '<span class="legend-item"><span class="legend-dot layer-1"></span> 1-5期</span>';
      html += '<span class="legend-item"><span class="legend-dot layer-2"></span> 6-10期</span>';
      html += '<span class="legend-item"><span class="legend-dot layer-3"></span> 11-20期</span>';
      html += '<span class="legend-item"><span class="legend-dot layer-4"></span> 21+期 (高遗漏)</span>';
      html += '</div>';

      html += '<div class="chart-card">';
      html += '<div class="title"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary)"></span>遗漏热力图</div>';
      html += '<div id="heatmap-'+name+'" class="chart-box"></div>';
      html += '</div>';

      html += '<div class="grid-2">';
      html += '<div class="chart-card">';
      html += '<div class="title"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold)"></span>遗漏统计总览</div>';
      html += '<div id="stats-'+name+'" class="chart-box-short"></div>';
      html += '</div>';
      html += '<div class="chart-card">';
      html += '<div class="title"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)"></span>号码遗漏排名 (当前)</div>';
      html += '<div id="rank-'+name+'" class="chart-box-short"></div>';
      html += '</div>';
      html += '</div>';

      panel.innerHTML = html;
      renderOmissionHeatmap(name, d, 30);
      renderStats(name, d, 30);
      renderRank(name, d);
    }

    function getMissMatrix(d, range) {
      if (!d.miss_chart || !d.miss_chart.series) return null;
      var n = Math.min(range, d.miss_chart.series[0].data.length);
      var dates = d.miss_chart.dates.slice(-n);
      var series = d.miss_chart.series.map(function(s) {
        return { name: s.name, data: s.data.slice(-n) };
      });
      return { dates: dates, series: series };
    }

    function getMissMatrixBig(name, d, range) {
      if (!d.miss_chart || !d.miss_chart.series) return null;
      var n = Math.min(range, d.miss_chart.series[0].data.length);
      var dates = d.miss_chart.dates.slice(-n);
      var maxShow = name === '快乐8' ? 20 : d.miss_chart.series.length;
      var series = d.miss_chart.series.slice(0, maxShow).map(function(s) {
        return { name: s.name, data: s.data.slice(-n) };
      });
      return { dates: dates, series: series };
    }

    function changeRange(name, range) {
      var panel = document.getElementById('panel-'+Array.from(document.querySelectorAll('.tab')).findIndex(function(t){return t.textContent===name;}));
      // Update button states
      document.querySelectorAll('#rangeBtns-'+name+' .btn').forEach(function(b) {
        b.classList.toggle('active', parseInt(b.dataset.range)===range);
      });
      renderOmissionHeatmap(name, data[name], range);
      renderStats(name, data[name], range);
    }

    function renderOmissionHeatmap(name, d, range) {
      var isDigit = name === '福彩3D' || name === '排列三';
      var mm = isDigit ? getMissMatrix(d, range) : getMissMatrixBig(name, d, range);
      if (!mm) return;

      var dates = mm.dates;
      var series = mm.series;
      var numNames = series.map(function(s){ return s.name; });

      // Build heatmap data [col, row, value]
      var heatData = [];
      for (var r = 0; r < dates.length; r++) {
        for (var c = 0; c < series.length; c++) {
          heatData.push([c, r, series[c].data[r]]);
        }
      }

      // For digit lots: check which numbers appeared in each period (value=0 means appeared)
      var appears = {};
      if (isDigit && d.digit_trend) {
        var posNames = ['百位','十位','个位'];
        var digitSeries = d.miss_chart.series;
        for (var r = 0; r < dates.length; r++) {
          for (var c = 0; c < digitSeries.length; c++) {
            if (digitSeries[c].data[r] === 0) {
              appears[r+','+c] = true;
            }
          }
        }
      }

      var maxVal = 0;
      heatData.forEach(function(h){ if(h[2]>maxVal) maxVal=h[2]; });

      var el = document.getElementById('heatmap-'+name);
      if (!el) return;
      el.innerHTML = '';

      var chart = echarts.init(el, 'jinshuiyao', {renderer:'svg'});
      var option = {
        animation: false,
        tooltip: {
          appendToBody: true,
          formatter: function(p) {
            var v = p.data[2];
            var num = series[p.data[0]].name;
            var period = dates[p.data[1]];
            var layer = '';
            if (v === 0) layer = '本期出现';
            else if (v <= 5) layer = '低遗漏 (1-5期)';
            else if (v <= 10) layer = '中遗漏 (6-10期)';
            else if (v <= 20) layer = '高遗漏 (11-20期)';
            else layer = '超高遗漏 (21+期)';
            var layerColor = '#00d4aa';
            if (v > 0 && v <= 5) layerColor = '#163040';
            else if (v <= 10) layerColor = '#1a5c4a';
            else if (v <= 20) layerColor = '#2d5e8a';
            else if (v > 20) layerColor = '#8a3a3a';
            return '<div style="font-size:13px">' +
              '<b>'+num+'</b> &middot; 期号: '+period + '<br>' +
              '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+layerColor+';margin-right:4px;vertical-align:middle"></span>' +
              '遗漏: <b>'+v+'</b> 期 &middot; '+layer + '<br>' +
              '</div>';
          }
        },
        grid: { top: 20, bottom: 60, left: 60, right: 100 },
        xAxis: {
          type: 'category',
          data: numNames,
          axisLine: { lineStyle: { color: '#1e2a40' } },
          axisLabel: { color: '#7a8499', fontSize: 10, rotate: numNames.length > 15 ? 45 : 0 },
          splitArea: { show: true, areaStyle: { color: ['rgba(30,42,64,0.2)','rgba(30,42,64,0.05)'] } }
        },
        yAxis: {
          type: 'category',
          data: dates,
          axisLine: { lineStyle: { color: '#1e2a40' } },
          axisLabel: { color: '#7a8499', fontSize: 9 },
          splitArea: { show: true, areaStyle: { color: ['rgba(30,42,64,0.2)','rgba(30,42,64,0.05)'] } }
        },
        visualMap: {
          min: 0,
          max: Math.max(maxVal, 25),
          calculable: true,
          orient: 'vertical',
          right: 10,
          top: 'center',
          inRange: {
            color: ['#00d4aa','#163040','#1a5c4a','#2d5e8a','#8a3a3a','#ff4444']
          },
          textStyle: { color: '#7a8499' },
          formatter: function(v) {
            if (v === 0) return '出现';
            if (v <= 5) return '1-5期';
            if (v <= 10) return '6-10期';
            if (v <= 20) return '11-20期';
            return '21+期';
          }
        },
        series: [{
          type: 'heatmap',
          data: heatData,
          label: {
            show: dates.length <= 30,
            color: '#e4e8f1',
            fontSize: 10,
            formatter: function(p) {
              var v = p.data[2];
              return v === 0 ? '\u2713' : v;
            }
          },
          emphasis: {
            itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,212,170,0.5)' }
          }
        }]
      };
      chart.setOption(option);
      window['_heatmap_'+name] = chart;
    }

    function renderStats(name, d, range) {
      var isDigit = name === '福彩3D' || name === '排列三';
      var mm = isDigit ? getMissMatrix(d, range) : getMissMatrixBig(name, d, range);
      if (!mm) return;
      var series = mm.series;
      var el = document.getElementById('stats-'+name);
      if (!el) return;

      var html = '<table class="stats-table"><thead><tr><th>号码</th><th>当前遗漏</th><th>平均遗漏</th><th>最大遗漏</th><th>出现次数</th><th>状态</th></tr></thead><tbody>';
      for (var i = 0; i < series.length; i++) {
        var s = series[i];
        var cur = s.data[s.data.length-1];
        var sum = 0, max = 0, count = 0;
        s.data.forEach(function(v) {
          sum += v;
          if (v > max) max = v;
          if (v === 0) count++;
        });
        var avg = (sum / s.data.length).toFixed(1);
        var status = '';
        var statusClass = '';
        if (cur === 0) { status = '出现'; statusClass = 'badge-appear'; }
        else if (cur <= 5) { status = '低遗漏'; statusClass = 'badge-warm'; }
        else if (cur <= 10) { status = '中遗漏'; statusClass = 'badge-warm'; }
        else { status = '高遗漏'; statusClass = 'badge-cold'; }

        html += '<tr><td class="num-cell">'+s.name.replace('号','')+'</td>' +
          '<td class="stats-val'+(cur>10?' miss-high':cur>5?' miss-mid':' miss-low')+'">'+cur+'</td>' +
          '<td class="stats-val">'+avg+'</td>' +
          '<td class="stats-val miss-high">'+max+'</td>' +
          '<td class="stats-val">'+count+'</td>' +
          '<td><span class="badge '+statusClass+'">'+status+'</span></td></tr>';
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function renderRank(name, d) {
      var isDigit = name === '福彩3D' || name === '排列三';
      if (!d.miss_chart || !d.miss_chart.series) return;
      var series = d.miss_chart.series;
      if (!isDigit) series = series.slice(0, 20);
      var el = document.getElementById('rank-'+name);
      if (!el) return;

      // Sort by current omission descending
      var ranked = series.map(function(s, i) {
        return { name: s.name, cur: s.data[s.data.length-1], idx: i };
      }).sort(function(a,b){ return b.cur - a.cur; });

      var html = '<table class="stats-table"><thead><tr><th>排名</th><th>号码</th><th>遗漏</th></tr></thead><tbody>';
      ranked.forEach(function(r, i) {
        var rankClass = i < 3 ? 'miss-high' : (i < 6 ? 'miss-mid' : '');
        var icon = '';
        if (i === 0) icon = ' <span style="color:#ff6b6b">\u25B2</span>';
        else if (i === 1) icon = ' <span style="color:#ffd93d">\u25B2</span>';
        else if (i === 2) icon = ' <span style="color:#60a5fa">\u25B2</span>';
        html += '<tr><td>'+(i+1)+icon+'</td><td class="num-cell">'+r.name.replace('号','')+'</td>' +
          '<td class="stats-val '+(i<3?'miss-high':'')+'">'+r.cur+'</td></tr>';
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function downloadPNG(btn, name) {
      if (!btn) return;
      btn.onclick = function() {
        var chart = window['_heatmap_'+name];
        if (!chart) return;
        var url = chart.getDataURL({type:'png', backgroundColor:'#0b0f19'});
        var a = document.createElement('a');
        a.href = url;
        a.download = name + '-遗漏热力图.png';
        a.click();
      };
    }

    // Resize handler
    window.addEventListener('resize', function() {
      Object.keys(data).forEach(function(name) {
        var chart = window['_heatmap_'+name];
        if (chart) try { chart.resize(); } catch(e) {}
      });
    });
  </script>
</body>
</html>

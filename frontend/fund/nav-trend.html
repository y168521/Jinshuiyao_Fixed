<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 基金净值走势</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-up:var(--copper); --c-down:var(--jade); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #chartWrap { width:100%; height:400px; border-radius:8px; }
  select,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
  button { cursor:pointer; }
  button.primary { background:var(--c-up); color:var(--deep); border:none; font-weight:600; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin:10px 0; font-size:12px; }
  .legend-item { display:flex; align-items:center; gap:6px; }
  .legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .err { color:var(--err); font-size:13px; }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); font-size:12px; margin-left:8px; }
  @media(max-width:600px){ body{ padding:12px; } #chartWrap{ height:280px; } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/fund" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回基金分析中心</a></div>
<h1>基金净值走势</h1>
<div class="sub">多基金净值叠加对比 · 时间区间可调 · 基于 TradingView Lightweight Charts</div>

<div class="card">
  <div class="flex">
    <select id="fund1"><option value="">加载中...</option></select>
    <select id="fund2"><option value="">— 不对比 —</option></select>
    <select id="period"><option value="1m">近1月</option><option value="3m" selected>近3月</option><option value="6m">近6月</option><option value="1y">近1年</option><option value="3y">近3年</option></select>
    <button class="primary" onclick="loadTrend()">加载</button>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()"> 自动刷新
    </label>
    <select id="refreshInterval" style="width:70px;font-size:11px">
      <option value="30">30秒</option><option value="60" selected>1分钟</option><option value="300">5分钟</option>
    </select>
    <span id="status" class="muted"><span class="spinner"></span>加载中...</span>
  </div>
</div>

<div class="card">
  <div class="legend" id="legend"></div>
  <div id="chartWrap"></div>
</div>

<div class="card" id="metricsCard" style="display:none;">
  <h2>区间业绩指标</h2>
  <div id="metricsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const BASE = window.location.origin;
const COLORS = ['#c8755a','#2d8b7e','#5bc0de','#c9a96e','#e8ecf1','#d29922'];
let chart = null, seriesList = [], pool = [];

function fmtPct(n){ if(n==null)return'—';const v=Number(n);return(v>=0?'+':'')+v.toFixed(2)+'%'; }

function initChart(){
  if(chart) chart.remove();
  chart = LightweightCharts.createChart(document.getElementById('chartWrap'), {
    layout: { textColor: '#7a8499', background: { type: 'solid', color: '#131a2a' } },
    grid: { vertLines: { color: 'rgba(232,236,241,0.06)' }, horzLines: { color: 'rgba(232,236,241,0.06)' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: 'rgba(232,236,241,0.1)' },
    timeScale: { borderColor: 'rgba(232,236,241,0.1)', timeVisible: true },
    watermark: { visible: true, text: '金水谣 · 基金净值', color: 'rgba(255,255,255,0.04)', fontSize: 20 }
  });
  chart.applyOptions({ width: chart.chartElement().clientWidth });
}

function applyData(funds){
  seriesList = [];
  funds.forEach((f,si)=>{
    const line = chart.addLineSeries({
      color: COLORS[si % COLORS.length],
      lineWidth: 2,
      title: f.name,
      priceFormat: { type: 'price', precision: 4, minMove: 0.0001 },
      lastValueVisible: true,
      priceLineVisible: false
    });
    line.setData(f.nav_series.map(p=>({ time: p.date, value: p.value })));
    seriesList.push(line);
  });
  chart.timeScale().fitContent();
}

async function loadPool(){
  try{
    const r = await fetch(BASE+'/api/fund/pool');
    const j = await r.json();
    if(j.ok && j.pool && j.pool.length){
      pool = j.pool;
      const opts = pool.map(p=>`<option value="${p.code}">${p.name}</option>`).join('');
      document.getElementById('fund1').innerHTML = opts;
      document.getElementById('fund2').innerHTML = '<option value="">— 不对比 —</option>' + opts;
      document.getElementById('fund2').value = pool.length > 1 ? pool[1].code : '';
    } else {
      document.getElementById('fund1').innerHTML = '<option value="">基金池为空</option>';
    }
  } catch(e){
    document.getElementById('fund1').innerHTML = '<option value="">基金池加载失败</option>';
  }
}

async function loadTrend(){
  const c1 = document.getElementById('fund1').value;
  const c2 = document.getElementById('fund2').value;
  const period = document.getElementById('period').value;
  if(!c1){ document.getElementById('status').textContent = '无可用基金'; return; }
  document.getElementById('status').textContent = '加载中...';
  initChart();
  const codes = [c1]; if(c2) codes.push(c2);
  try{
    const r = await fetch(BASE+'/api/fund/nav-series', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codes, period})});
    const j = await r.json();
    if(j.ok && j.funds && j.funds.length){
      chartData = j.funds;
      applyData(j.funds);
      document.getElementById('legend').innerHTML = j.funds.map((s,i)=>`<span class="legend-item"><span class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></span>${s.name}${s.mode==='mock'?' <span class="warn">(模拟)</span>':''}</span>`).join('');
      document.getElementById('metricsCard').style.display='block';
      document.getElementById('metricsGrid').innerHTML = j.funds.map(f=>`
        <div class="card" style="padding:12px;">
          <div style="font-size:11px;color:var(--muted)">${f.name}</div>
          <div style="font-size:15px;font-weight:700;margin-top:6px">区间收益 ${fmtPct(f.metrics.period_return)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">最大回撤 ${fmtPct(f.metrics.max_drawdown)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${f.points} 个交易日 · ${f.start} ~ ${f.end}</div>
        </div>`).join('');
      const mockN = j.mock_count || 0;
      document.getElementById('status').textContent = mockN > 0 ? `已更新（${mockN} 只基金为模拟兜底数据）` : '已更新（真实数据）';
    } else {
      document.getElementById('status').innerHTML = `<span class="err">加载失败: ${j.error || '无数据'}</span>`;
    }
  } catch(e){
    document.getElementById('status').innerHTML = `<span class="err">接口异常: ${e.message}</span>`;
  }
}

let autoTimer = null;
function toggleAutoRefresh(){
  clearInterval(autoTimer); autoTimer = null;
  if(!document.getElementById('autoRefresh').checked) return;
  const ms = parseInt(document.getElementById('refreshInterval').value)*1000;
  autoTimer = setInterval(loadTrend, ms);
}
document.getElementById('refreshInterval').addEventListener('change', toggleAutoRefresh);

(async function init(){
  await loadPool();
  loadTrend();
})();
window.addEventListener('resize', ()=>{ if(chart) chart.resize(chart.chartElement().clientWidth, 400); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 基金分析仪表盘</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim);
          --c-ok:var(--ok); --c-warn:var(--warn); --bad:var(--err); --half:var(--ice); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
  @media(max-width:900px){ .grid2,.grid3{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h3 { font-size:13px; margin:10px 0 6px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .b-buy { background:rgba(34,197,94,.15); color:var(--c-ok); }
  .b-hold { background:rgba(59,130,246,.15); color:var(--half); }
  .b-watch { background:rgba(239,68,68,.15); color:var(--bad); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--c-ok); animation:p 1.6s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.3} }
  .err { color:var(--bad); font-size:13px; }
  .muted { color:var(--muted); }
  .val { font-size:22px; font-weight:700; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .tabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:5px 12px; border-radius:6px; background:var(--card); border:1px solid var(--border);
         cursor:pointer; font-size:12px; color:var(--muted); }
  .tab.active { background:var(--c-ok); color:var(--deep); border-color:var(--c-ok); font-weight:600; }
  .tab:hover { border-color:var(--c-ok); }
  select,input { background:var(--deep); color:var(--txt); border:1px solid var(--border);
                 border-radius:6px; padding:5px 10px; font-size:12px; }
  .flex { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mt12 { margin-top:12px; }
  .mb12 { margin-bottom:12px; }
  .w100 { width:100%; }
</style>
</head>
<body>
  <div style="margin-bottom:10px;"><a href="/fund" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回基金分析中心</a></div>
  <div class="topbar">
    <div><h1>基金分析仪表盘</h1>
      <div class="sub">基金对比 · 策略回测 · 业绩归因 — 每 30 秒自动刷新</div></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="pulse" id="pulse"></span>
      <span class="muted" id="ts">—</span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="overview">基金对比</div>
    <div class="tab" data-tab="backtest">策略回测</div>
    <div class="tab" data-tab="strategies">策略列表</div>
    <div class="tab" data-tab="compare">多策略对比</div>
  </div>

  <div id="overview" class="tab-content">
    <div class="flex mb12">
      <button onclick="loadOverview()" style="background:var(--c-ok);color:var(--deep);border:none;
        border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;">刷新</button>
    </div>
    <div class="grid2" id="overview-grid">
      <div class="card"><h2>基金对比</h2><div id="compare-table">加载中...</div></div>
      <div class="card"><h2>基金状态</h2><div id="status-info">加载中...</div></div>
    </div>
  </div>

  <div id="backtest" class="tab-content" style="display:none;">
    <div class="flex mb12">
      <select id="bt-strategy">
        <option value="买入持有">买入持有</option>
        <option value="定投">定投</option>
        <option value="均线择时">均线择时</option>
        <option value="网格定投">网格定投</option>
        <option value="目标止盈">目标止盈</option>
        <option value="股债平衡">股债平衡</option>
        <option value="定投+止盈"selected>定投+止盈</option>
      </select>
      <label><input type="checkbox" id="bt-enhanced" checked> 增强模式</label>
      <button onclick="runBacktest()" style="background:var(--c-ok);color:var(--deep);border:none;
        border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;">运行回测</button>
    </div>
    <div class="grid2" id="backtest-grid">
      <div class="card"><h2>回测结果</h2><div id="backtest-result">选择策略后运行回测</div></div>
      <div class="card"><h2>归因指标</h2><div id="metrics-result">运行回测后显示</div></div>
    </div>
  </div>

  <div id="strategies" class="tab-content" style="display:none;">
    <div class="card"><h2>所有可用策略</h2><div id="strategy-list">加载中...</div></div>
  </div>

  <div id="compare" class="tab-content" style="display:none;">
    <div class="flex mb12">
      <button onclick="runStrategyCompare()" style="background:var(--c-ok);color:var(--deep);border:none;
        border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;">运行多策略对比</button>
    </div>
    <div class="card"><h2>多策略对比</h2><div id="compare-result">点击按钮运行多策略对比</div></div>
  </div>

<script>
const BASE = '/Jinshuiyao_Fixed';
function ts() { document.getElementById('ts').textContent = new Date().toLocaleTimeString(); }

document.getElementById('tabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(tab.dataset.tab).style.display = 'block';
});

async function api(path, body) {
  const opt = { headers: {'Content-Type':'application/json'} };
  if (body) opt.method = 'POST', opt.body = JSON.stringify(body);
  const r = await fetch(BASE + path, opt);
  return r.json();
}

async function loadOverview() {
  ts();
  const [comp, status] = await Promise.all([
    api('/api/fund/compare?top_n=10'),
    api('/api/fund/status'),
  ]);
  const ct = document.getElementById('compare-table');
  if (comp.ok && comp.comparison) {
    let h = '<table><thead><tr><th>代码</th><th>名称</th><th>年化</th><th>回撤</th><th>夏普</th><th>评分</th><th>等级</th><th>经理</th></tr></thead><tbody>';
    for (const f of comp.comparison) {
      h += `<tr><td>${f.code}</td><td>${f.name}</td>
        <td class="num">${f.annual_return != null ? f.annual_return.toFixed(2)+'%' : '—'}</td>
        <td class="num">${f.max_drawdown != null ? f.max_drawdown.toFixed(2)+'%' : '—'}</td>
        <td class="num">${f.sharpe != null ? f.sharpe.toFixed(2) : '—'}</td>
        <td class="num">${f.score != null ? f.score.toFixed(1) : '—'}</td>
        <td><span class="badge ${f.grade && f.grade.startsWith('A') ? 'b-buy' : f.grade === 'B' ? 'b-hold' : 'b-watch'}">${f.grade || 'N/A'}</span></td>
        <td>${f.manager || '—'}</td></tr>`;
    }
    h += '</tbody></table>';
    ct.innerHTML = h;
  } else {
    ct.innerHTML = `<span class="err">加载失败: ${comp.error || '未知'}</span>`;
  }

  const si = document.getElementById('status-info');
  if (status.ok && status.status) {
    const s = status.status;
    si.innerHTML = `<table>
      <tr><th>缓存基金数</th><td>${s.cache_size}</td></tr>
      <tr><th>默认基金池</th><td>${s.default_funds}</td></tr>
      <tr><th>引擎</th><td>${s.engines.join(' | ')}</td></tr>
      <tr><th>最后运行</th><td>${s.last_run || '—'}</td></tr>
      <tr><th>就绪状态</th><td>${s.ready ? '<span class="badge b-buy">就绪</span>' : '<span class="badge b-watch">未就绪</span>'}</td></tr>
    </table>`;
  } else {
    si.innerHTML = `<span class="err">加载失败</span>`;
  }
}

async function runBacktest() {
  ts();
  const strategy = document.getElementById('bt-strategy').value;
  const enhanced = document.getElementById('bt-enhanced').checked;
  const res = await api('/api/fund/backtest', { strategy, enhanced });

  const br = document.getElementById('backtest-result');
  const mr = document.getElementById('metrics-result');

  if (res.ok) {
    const rpt = res.report || {};
    br.innerHTML = `<table>
      <tr><th>初始资金</th><td class="num">${rpt.initial_capital || 100000}</td></tr>
      <tr><th>最终价值</th><td class="num">${rpt.final_value || '—'}</td></tr>
      <tr><th>总收益率</th><td class="num">${rpt.total_return_pct || '—'}</td></tr>
      <tr><th>最大回撤</th><td class="num">${rpt.max_drawdown_pct || '—'}</td></tr>
      <tr><th>夏普比率</th><td class="num">${rpt.sharpe_ratio != null ? rpt.sharpe_ratio.toFixed(3) : '—'}</td></tr>
      <tr><th>交易次数</th><td class="num">${rpt.trade_count || 0}</td></tr>
      <tr><th>胜率</th><td class="num">${rpt.win_rate != null ? (rpt.win_rate*100).toFixed(1)+'%' : '—'}</td></tr>
    </table>
    ${rpt.summary ? `<p class="muted" style="margin:8px 0 0;font-size:12px;">${rpt.summary}</p>` : ''}`;

    const metrics = res.metrics;
    if (metrics && !metrics.error) {
      mr.innerHTML = `<table>
        <tr><th>Alpha (α)</th><td class="num">${metrics.alpha_pct || '—'}</td></tr>
        <tr><th>Beta (β)</th><td class="num">${metrics.beta != null ? metrics.beta.toFixed(4) : '—'}</td></tr>
        <tr><th>跟踪误差</th><td class="num">${metrics.tracking_error_pct || '—'}</td></tr>
        <tr><th>信息比率</th><td class="num">${metrics.information_ratio != null ? metrics.information_ratio.toFixed(4) : '—'}</td></tr>
        <tr><th>上行捕获率</th><td class="num">${metrics.up_capture_pct || '—'}</td></tr>
        <tr><th>下行捕获率</th><td class="num">${metrics.down_capture_pct || '—'}</td></tr>
        <tr><th>上行/下行比</th><td class="num">${metrics.up_down_ratio != null ? metrics.up_down_ratio.toFixed(4) : '—'}</td></tr>
        <tr><th>相关系数</th><td class="num">${metrics.correlation != null ? metrics.correlation.toFixed(4) : '—'}</td></tr>
        <tr><th>R²</th><td class="num">${metrics.r_squared != null ? metrics.r_squared.toFixed(4) : '—'}</td></tr>
      </table>
      ${metrics.summary ? `<p class="muted" style="margin:8px 0 0;font-size:12px;">${metrics.summary}</p>` : ''}`;
    } else {
      mr.innerHTML = '<span class="muted">未提供基准数据，无归因指标。传入 benchmark 参数可计算 Alpha/Beta。</span>';
    }
  } else {
    br.innerHTML = `<span class="err">回测失败: ${res.error || '未知'}</span>`;
  }
}

async function loadStrategies() {
  ts();
  const res = await api('/api/fund/strategies');
  const el = document.getElementById('strategy-list');
  if (res.ok && res.strategies) {
    let h = '<table><thead><tr><th>策略名称</th><th>说明</th></tr></thead><tbody>';
    for (const s of res.strategies) {
      h += `<tr><td><strong>${s.name}</strong></td><td>${s.description || '—'}</td></tr>`;
    }
    h += '</tbody></table>';
    el.innerHTML = h;
  } else {
    el.innerHTML = `<span class="err">加载失败</span>`;
  }
}

async function runStrategyCompare() {
  ts();
  const el = document.getElementById('compare-result');
  el.innerHTML = '运行中...';
  const res = await api('/api/fund/compare-strategies');
  if (res.ok && res.results) {
    let h = '';
    for (const [code, data] of Object.entries(res.results)) {
      if (!data.success) continue;
      h += `<h3>${code}</h3>`;
      h += `<table><thead><tr><th>策略</th><th>收益率</th><th>最大回撤</th><th>夏普</th><th>说明</th></tr></thead><tbody>`;
      for (const c of data.comparisons || []) {
        const best = c.strategy === data.best_by_return;
        h += `<tr style="${best ? 'background:rgba(34,197,94,.08)' : ''}">
          <td><strong>${c.strategy}</strong>${best ? ' ★' : ''}</td>
          <td class="num">${c.total_return_pct || '—'}</td>
          <td class="num">${c.max_drawdown_pct || '—'}</td>
          <td class="num">${c.sharpe_ratio != null ? c.sharpe_ratio.toFixed(2) : '—'}</td>
          <td class="muted" style="font-size:11px;">${c.desc || ''}</td>
        </tr>`;
      }
      h += `</tbody></table>
        <p class="muted" style="font-size:12px;">收益最佳: ${data.best_by_return || '—'} | 夏普最佳: ${data.best_by_sharpe || '—'} | 回撤最小: ${data.best_by_drawdown || '—'}</p>`;
    }
    el.innerHTML = h || '<span class="muted">无对比数据</span>';
  } else {
    el.innerHTML = `<span class="err">对比失败: ${res.error || '未知'}</span>`;
  }
}

loadOverview();
loadStrategies();
setInterval(loadOverview, 30000);
</script>
</body>
</html>

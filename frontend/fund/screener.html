<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 基金筛选</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-up:var(--copper); --c-down:var(--jade); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  select,input,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
  button { cursor:pointer; }
  button.primary { background:var(--c-up); color:var(--deep); border:none; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll-x { overflow-x:auto; }
  .filter-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:14px; }
  .filter-group label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  .filter-group select,.filter-group input { width:100%; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .b-buy { background:rgba(45, 139, 126, .15); color:var(--c-up); }
  .b-hold { background:rgba(59,130,246,.15); color:var(--half); }
  .b-watch { background:rgba(200, 117, 90, .15); color:var(--bad); }
  .muted { color:var(--muted); }
  @media(max-width:600px){ body{ padding:12px; } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/fund" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回基金分析中心</a></div>
<h1>基金筛选</h1>
<div class="sub">多维度筛选基金：收益率/回撤/夏普/评级/规模/基金经理</div>

<div class="card">
  <h2>筛选条件</h2>
  <div class="filter-row">
    <div class="filter-group"><label>基金类型</label><select id="fType"><option value="">全部</option><option>股票型</option><option selected>混合型</option><option>债券型</option><option>指数型</option><option>货币型</option></select></div>
    <div class="filter-group"><label>近1年收益率</label><select id="fReturn"><option value="">不限</option><option value="10">&gt;10%</option><option value="20" selected>&gt;20%</option><option value="30">&gt;30%</option><option value="50">&gt;50%</option></select></div>
    <div class="filter-group"><label>最大回撤</label><select id="fDrawdown"><option value="">不限</option><option value="5">&lt;5%</option><option value="10" selected>&lt;10%</option><option value="15">&lt;15%</option><option value="20">&lt;20%</option></select></div>
    <div class="filter-group"><label>夏普比率</label><select id="fSharpe"><option value="">不限</option><option value="1">&gt;1</option><option value="1.5" selected>&gt;1.5</option><option value="2">&gt;2</option></select></div>
    <div class="filter-group"><label>基金规模</label><select id="fSize"><option value="">不限</option><option value="1">&lt;1亿</option><option value="5">1-5亿</option><option value="50" selected>5-50亿</option><option value="100">&gt;50亿</option></select></div>
    <div class="filter-group"><label>晨星评级</label><select id="fRating"><option value="">不限</option><option value="5">★★★★★</option><option value="4" selected>★★★★及以上</option><option value="3">★★★及以上</option></select></div>
  </div>
  <button class="primary" onclick="runScreen()">运行筛选</button>
  <span id="resultCount" class="muted" style="margin-left:12px;"></span>
</div>

<div class="card scroll-x" id="resultTable" style="display:none;">
  <h2>筛选结果</h2>
  <table><thead><tr><th>基金名称</th><th>类型</th><th>近1年</th><th>近3年</th><th>最大回撤</th><th>夏普</th><th>规模(亿)</th><th>评级</th><th>建议</th></tr></thead>
  <tbody id="resultBody"></tbody></table>
</div>

<script>
const MOCK_FUNDS = [
  {name:'华夏蓝筹混合',type:'混合型',ret1y:28.5,ret3y:65.2,dd:-8.2,sharpe:1.8,size:45.2,rating:5,action:'买入'},
  {name:'嘉实稳健混合',type:'混合型',ret1y:22.3,ret3y:52.1,dd:-6.5,sharpe:1.6,size:38.7,rating:5,action:'买入'},
  {name:'易方达新收益',type:'混合型',ret1y:35.1,ret3y:82.3,dd:-12.5,sharpe:2.1,size:62.1,rating:5,action:'买入'},
  {name:'广发行业精选',type:'股票型',ret1y:18.7,ret3y:42.5,dd:-14.2,sharpe:1.3,size:28.3,rating:4,action:'持有'},
  {name:'富国天惠成长',type:'混合型',ret1y:25.6,ret3y:58.9,dd:-7.8,sharpe:1.7,size:52.6,rating:4,action:'买入'},
  {name:'中欧医疗健康',type:'股票型',ret1y:-5.2,ret3y:15.8,dd:-28.5,sharpe:0.6,size:18.5,rating:3,action:'观望'},
  {name:'招商产业债券',type:'债券型',ret1y:4.8,ret3y:13.2,dd:-1.2,sharpe:2.3,size:85.4,rating:5,action:'买入'},
  {name:'南方沪深300',type:'指数型',ret1y:12.5,ret3y:28.6,dd:-15.8,sharpe:0.9,size:120.5,rating:4,action:'持有'},
  {name:'天弘永利债券',type:'债券型',ret1y:5.2,ret3y:15.1,dd:-0.8,sharpe:2.5,size:210.8,rating:5,action:'买入'},
  {name:'华安科技动力',type:'股票型',ret1y:32.4,ret3y:75.6,dd:-18.5,sharpe:1.9,size:22.1,rating:4,action:'买入'},
  {name:'银华中小盘',type:'混合型',ret1y:15.8,ret3y:38.2,dd:-16.2,sharpe:1.1,size:15.6,rating:3,action:'持有'},
  {name:'鹏华价值成长',type:'混合型',ret1y:20.1,ret3y:48.5,dd:-9.5,sharpe:1.5,size:32.8,rating:4,action:'持有'},
];

function fmtPct(n){ if(n==null)return'—';return(n>=0?'+':'')+n.toFixed(1)+'%'; }

function runScreen(){
  const t = document.getElementById('fType').value;
  const r = parseFloat(document.getElementById('fReturn').value)||0;
  const d = parseFloat(document.getElementById('fDrawdown').value)||999;
  const s = parseFloat(document.getElementById('fSharpe').value)||0;
  const sz = document.getElementById('fSize').value;
  const rt = parseInt(document.getElementById('fRating').value)||0;

  let results = MOCK_FUNDS.filter(f=>{
    if(t && f.type!==t) return false;
    if(r && f.ret1y<r) return false;
    if(d<999 && Math.abs(f.dd)>d) return false;
    if(s && f.sharpe<s) return false;
    if(rt && f.rating<rt) return false;
    return true;
  });

  const tb=document.getElementById('resultTable'); tb.style.display='block';
  const body=document.getElementById('resultBody');
  if(!results.length){
    body.innerHTML='<tr><td colspan="9" style="text-align:center;color:var(--muted)">无匹配基金，请放宽筛选条件</td></tr>';
  } else {
    body.innerHTML = results.map(f=>{
      const actCls = f.action==='买入'?'b-buy':f.action==='持有'?'b-hold':'b-watch';
      return `<tr><td>${f.name}</td><td>${f.type}</td><td class="num" style="color:var(--c-up)">${fmtPct(f.ret1y)}</td><td class="num" style="color:var(--c-up)">${fmtPct(f.ret3y)}</td><td class="num" style="color:var(--c-down)">${fmtPct(f.dd)}</td><td class="num">${f.sharpe.toFixed(2)}</td><td class="num">${f.size.toFixed(1)}</td><td class="num">${'★'.repeat(f.rating)}</td><td><span class="badge ${actCls}">${f.action}</span></td></tr>`;
    }).join('');
  }
  document.getElementById('resultCount').textContent = `找到 ${results.length} 只基金`;
}

runScreen();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 基金筛选</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-up:var(--copper); --c-down:var(--jade); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  select,input,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
  button { cursor:pointer; }
  button.primary { background:var(--c-up); color:var(--deep); border:none; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll-x { overflow-x:auto; }
  .filter-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:14px; }
  .filter-group label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  .filter-group select,.filter-group input { width:100%; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .b-buy { background:rgba(45, 139, 126, .15); color:var(--c-up); }
  .b-hold { background:rgba(59,130,246,.15); color:var(--half); }
  .b-watch { background:rgba(200, 117, 90, .15); color:var(--bad); }
  .muted { color:var(--muted); }
  .err { color:var(--err); font-size:13px; }
  .warn { color:var(--warn); font-size:12px; }
  @media(max-width:600px){ body{ padding:12px; } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/fund" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回基金分析中心</a></div>
<h1>基金筛选</h1>
<div class="sub">基于真实净值数据多维度筛选：近1年收益/回撤/夏普/评级/规模</div>

<div class="card">
  <h2>筛选条件</h2>
  <div class="filter-row">
    <div class="filter-group"><label>基金类型</label><select id="fType"><option value="">全部</option><option>股票型</option><option selected>混合型</option><option>债券型</option><option>指数型</option><option>货币型</option></select></div>
    <div class="filter-group"><label>近1年收益率</label><select id="fReturn"><option value="">不限</option><option value="10">&gt;10%</option><option value="20">&gt;20%</option><option value="30">&gt;30%</option><option value="50">&gt;50%</option></select></div>
    <div class="filter-group"><label>最大回撤</label><select id="fDrawdown"><option value="">不限</option><option value="5">&lt;5%</option><option value="10">&lt;10%</option><option value="15">&lt;15%</option><option value="20">&lt;20%</option></select></div>
    <div class="filter-group"><label>夏普比率</label><select id="fSharpe"><option value="">不限</option><option value="1">&gt;1</option><option value="1.5">&gt;1.5</option><option value="2">&gt;2</option></select></div>
    <div class="filter-group"><label>综合评级</label><select id="fRating"><option value="">不限</option><option value="A">A/A+</option><option value="B">B及以上</option><option value="C">C及以上</option></select></div>
  </div>
  <button class="primary" onclick="runScreen()">运行筛选</button>
  <span id="resultCount" class="muted" style="margin-left:12px;"></span>
</div>

<div class="card scroll-x" id="resultTable" style="display:none;">
  <h2>筛选结果</h2>
  <table><thead><tr><th>基金名称</th><th>类型</th><th>近1年</th><th>年化</th><th>最大回撤</th><th>夏普</th><th>规模(亿)</th><th>评级</th><th>经理</th><th>建议</th></tr></thead>
  <tbody id="resultBody"></tbody></table>
</div>

<script>
const BASE = window.location.origin;

function fmtPct(n){ if(n==null)return'—';const v=Number(n);return(v>=0?'+':'')+v.toFixed(1)+'%'; }

function actionOf(grade){
  if(!grade) return '观望';
  if(grade.startsWith('A')) return '买入';
  if(grade === 'B') return '持有';
  return '观望';
}

async function runScreen(){
  const t = document.getElementById('fType').value;
  const r = parseFloat(document.getElementById('fReturn').value)||0;
  const d = parseFloat(document.getElementById('fDrawdown').value)||999;
  const s = parseFloat(document.getElementById('fSharpe').value)||0;
  const rt = document.getElementById('fRating').value;
  const body = document.getElementById('resultBody');
  const tb = document.getElementById('resultTable');
  const rc = document.getElementById('resultCount');
  rc.textContent = '加载中...';

  try{
    const res = await fetch(BASE + '/api/fund/compare', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const j = await res.json();
    if(!j.ok || !j.comparison){
      tb.style.display='block';
      body.innerHTML = `<tr><td colspan="10" style="text-align:center" class="err">加载失败: ${j.error || '无数据'}</td></tr>`;
      rc.textContent = '';
      return;
    }

    let results = j.comparison.filter(f=>{
      if(t && (f.type||'') !== t) return false;
      if(r && (f.return_1y==null || f.return_1y < r)) return false;
      if(d<999 && (f.max_drawdown==null || Math.abs(f.max_drawdown) > d)) return false;
      if(s && (f.sharpe==null || f.sharpe < s)) return false;
      if(rt==='A' && !(f.grade||'').startsWith('A')) return false;
      if(rt==='B' && !['A','B'].includes((f.grade||'')[0])) return false;
      if(rt==='C' && !['A','B','C'].includes((f.grade||'')[0])) return false;
      return true;
    });

    tb.style.display='block';
    if(!results.length){
      body.innerHTML='<tr><td colspan="10" style="text-align:center;color:var(--muted)">无匹配基金，请放宽筛选条件</td></tr>';
    } else {
      body.innerHTML = results.map(f=>{
        const act = actionOf(f.grade);
        const actCls = act==='买入'?'b-buy':act==='持有'?'b-hold':'b-watch';
        return `<tr><td>${f.name}</td><td>${f.type || '—'}</td>
          <td class="num" style="color:var(--c-up)">${fmtPct(f.return_1y)}</td>
          <td class="num" style="color:var(--c-up)">${fmtPct(f.annual_return)}</td>
          <td class="num" style="color:var(--c-down)">${fmtPct(f.max_drawdown)}</td>
          <td class="num">${f.sharpe!=null?f.sharpe.toFixed(2):'—'}</td>
          <td class="num">${f.scale!=null?f.scale.toFixed(1):'—'}</td>
          <td class="num">${f.grade || '—'}</td>
          <td>${f.manager || '—'}</td>
          <td><span class="badge ${actCls}">${act}</span></td></tr>`;
      }).join('');
    }
    rc.textContent = `找到 ${results.length} 只基金` + (j.mode==='mock' ? ' <span class="warn">(模拟兜底数据)</span>' : '');
  } catch(e){
    tb.style.display='block';
    body.innerHTML = `<tr><td colspan="10" style="text-align:center" class="err">请求异常: ${e.message}</td></tr>`;
    rc.textContent = '';
  }
}

runScreen();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 定投模拟器</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
:root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-up:var(--copper); --c-down:var(--jade); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; max-width:960px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
.card h2 { font-size:15px; margin:0 0 12px; }
.flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#chartWrap { width:100%; height:360px; border-radius:8px; }
select,input,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
input[type=number] { width:100px; }
button { cursor:pointer; }
button.primary { background:var(--c-up); color:var(--deep); border:none; font-weight:600; padding:5px 14px; }
button.primary:hover { opacity:.85; }
.results-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-top:12px; }
.result-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
.result-label { font-size:11px; color:var(--muted); }
.result-value { font-size:22px; font-weight:700; margin-top:4px; }
.result-value.up { color:var(--c-up); }
.result-value.down { color:var(--c-down); }
.param-row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.param-row label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.legend { display:flex; gap:16px; flex-wrap:wrap; margin:10px 0; font-size:12px; }
.legend-item { display:flex; align-items:center; gap:6px; }
.legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.err { color:var(--copper); font-size:13px; }
.muted { color:var(--muted); }
.warn { color:var(--warn); font-size:12px; }
@media(max-width:600px){ body{ padding:12px; } #chartWrap{ height:260px; } .param-row{ flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/fund" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回基金分析中心</a></div>
<h1>定投模拟器</h1>
<div class="sub">模拟基金定投效果 — 买入成本、收益曲线、微笑曲线可视化（基于真实净值数据）</div>

<div class="card">
  <div class="param-row">
    <label>基金 <select id="fundSelect">
      <option value="">加载中...</option>
    </select></label>
    <label>每期金额 <input type="number" id="amount" value="1000" min="100" step="100"></label>
    <label>频率(天) <input type="number" id="every" value="30" min="5" max="90" step="5"></label>
    <label>费率(%) <input type="number" id="feeRate" value="0.15" min="0" step="0.05" style="width:80px;"></label>
    <button class="primary" onclick="runSimulation()">模拟</button>
  </div>
  <div id="status" class="muted" style="margin-top:10px;">设置参数后点击模拟</div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <h2>定投结果</h2>
  <div class="results-grid" id="resultsGrid"></div>
  <div class="legend" id="legend"></div>
  <div id="chartWrap"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const BASE = window.location.origin;
let chart = null;

function fmtMoney(n) { if (n == null) return '—'; return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtPct(n) { if (n == null) return '—'; const v = Number(n); return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

function initChart() {
  if (chart) chart.remove();
  chart = LightweightCharts.createChart(document.getElementById('chartWrap'), {
    layout: { textColor: '#7a8499', background: { type: 'solid', color: '#131a2a' } },
    grid: { vertLines: { color: 'rgba(232,236,241,0.06)' }, horzLines: { color: 'rgba(232,236,241,0.06)' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: 'rgba(232,236,241,0.1)' },
    timeScale: { borderColor: 'rgba(232,236,241,0.1)', timeVisible: true },
  });
}

async function loadPool() {
  try {
    const r = await fetch(BASE + '/api/fund/pool');
    const j = await r.json();
    const sel = document.getElementById('fundSelect');
    if (j.ok && j.pool && j.pool.length) {
      sel.innerHTML = j.pool.map(p => `<option value="${p.code}">${p.name}</option>`).join('');
    } else {
      sel.innerHTML = '<option value="">基金池为空</option>';
    }
  } catch (e) {
    document.getElementById('fundSelect').innerHTML = '<option value="">基金池加载失败</option>';
  }
}

async function runSimulation() {
  const code = document.getElementById('fundSelect').value;
  const amount = parseFloat(document.getElementById('amount').value) || 1000;
  const every = parseInt(document.getElementById('every').value) || 30;
  const feeRate = (parseFloat(document.getElementById('feeRate').value) || 0.15) / 100;
  const st = document.getElementById('status');
  if (!code) { st.textContent = '无可用基金'; return; }

  st.textContent = '计算中...';
  try {
    const r = await fetch(BASE + '/api/fund/backtest', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        strategy: '定投', codes: [code],
        amount_per_period: amount, every: every, fee_rate: feeRate
      })
    });
    const j = await r.json();
    if (j.ok && j.report) {
      const rpt = j.report;
      document.getElementById('resultCard').style.display = 'block';
      const grid = document.getElementById('resultsGrid');
      const returnPct = (rpt.total_return || 0) * 100;
      grid.innerHTML = `
        <div class="result-card"><div class="result-label">累计投入</div><div class="result-value up">${fmtMoney(rpt.total_invested)}</div></div>
        <div class="result-card"><div class="result-label">最终市值</div><div class="result-value up">${fmtMoney(rpt.final_value)}</div></div>
        <div class="result-card"><div class="result-label">收益率</div><div class="result-value ${returnPct >= 0 ? 'up' : 'down'}">${rpt.total_return_pct || fmtPct(returnPct)}</div></div>
        <div class="result-card"><div class="result-label">最大回撤</div><div class="result-value down">${rpt.max_drawdown_pct || '—'}</div></div>
        <div class="result-card"><div class="result-label">累计份额</div><div class="result-value up">${rpt.total_shares != null ? rpt.total_shares.toFixed(2) : '—'}</div></div>
        <div class="result-card"><div class="result-label">平均成本</div><div class="result-value">${rpt.avg_cost != null ? rpt.avg_cost.toFixed(4) : '—'}</div></div>
        <div class="result-card"><div class="result-label">定投期数</div><div class="result-value up">${rpt.num_purchases || 0}</div></div>
        <div class="result-card"><div class="result-label">盈亏平衡净值</div><div class="result-value">${rpt.break_even_nav != null ? rpt.break_even_nav.toFixed(4) : '—'}</div></div>
      `;

      const curve = rpt.curve || [];
      if (curve.length > 0) {
        initChart();
        const navLine = chart.addLineSeries({ color: '#c8755a', lineWidth: 2, title: '净值', lastValueVisible: true, priceLineVisible: false });
        navLine.setData(curve.map(p => ({ time: p.date, value: p.nav })));
        const costLine = chart.addLineSeries({ color: '#c9a96e', lineWidth: 2, title: '平均成本', lastValueVisible: true, priceLineVisible: false, lineStyle: 2 });
        costLine.setData(curve.map(p => ({ time: p.date, value: p.avg_cost })));
        chart.timeScale().fitContent();
        document.getElementById('legend').innerHTML =
          '<span class="legend-item"><span class="legend-dot" style="background:#c8755a"></span>净值走势</span>' +
          '<span class="legend-item"><span class="legend-dot" style="background:#c9a96e"></span>平均成本(虚线)</span>';
      }
      st.textContent = '模拟完成（真实净值数据）' + (rpt.summary ? ` — ${rpt.summary}` : '');
    } else {
      st.innerHTML = `<span class="err">模拟失败: ${j.error || '未知错误'}</span>`;
    }
  } catch (e) {
    st.innerHTML = `<span class="err">请求异常: ${e.message}</span>`;
  }
}

(async function init() {
  await loadPool();
  runSimulation();
})();
window.addEventListener('resize', () => { if (chart) chart.resize(chart.chartElement().clientWidth, 360); });
</script>
  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/topnav.js"></script>
</body>
</html>

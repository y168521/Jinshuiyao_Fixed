<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 个股详情</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
:root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); --c-up:var(--copper); --c-down:var(--jade); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:20px; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
.card h2 { font-size:15px; margin:0 0 12px; }
.flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#chartWrap { width:100%; height:400px; border-radius:8px; }
select,input,button { background:var(--deep); color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:5px 12px; font-size:12px; }
button { cursor:pointer; }
button.primary { background:var(--c-up); color:var(--deep); border:none; font-weight:600; padding:5px 14px; }
.price-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
.price-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
.price-label { font-size:11px; color:var(--muted); }
.price-value { font-size:22px; font-weight:700; margin-top:4px; }
.price-value.up { color:var(--c-up); }
.price-value.down { color:var(--c-down); }
.indicator-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.indicator-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; }
.indicator-name { font-size:11px; color:var(--muted); }
.indicator-val { font-size:16px; font-weight:600; margin-top:4px; }
.indicator-sig { font-size:11px; margin-top:2px; }
.indicator-sig.bull { color:var(--c-up); }
.indicator-sig.bear { color:var(--c-down); }
.indicator-sig.neutral { color:var(--muted); }
.tabs { display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; }
.tab { padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; background:var(--deep); color:var(--muted); border:1px solid transparent; }
.tab.active { background:var(--card); color:var(--gold); border-color:var(--gold); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }
.info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; font-size:13px; }
.info-item { padding:6px 10px; background:var(--bg); border-radius:6px; }
.info-label { color:var(--muted); font-size:11px; }
.info-value { margin-top:2px; }
@media(max-width:600px){ body{ padding:12px; } #chartWrap{ height:280px; } .price-grid{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div style="margin-bottom:10px;"><a href="/stock" style="color:var(--muted);font-size:13px;text-decoration:none;">&larr; 返回股票分析中心</a></div>
<h1>个股详情</h1>
<div class="sub">单只股票全景分析 — 实时行情、技术指标、多因子评分</div>

<div class="card">
  <div class="flex">
    <select id="codeSelect">
      <option value="000001">上证指数</option>
      <option value="000300" selected>沪深300</option>
      <option value="399001">深证成指</option>
      <option value="600519">贵州茅台</option>
      <option value="000858">五粮液</option>
      <option value="601318">中国平安</option>
      <option value="600036">招商银行</option>
      <option value="000333">美的集团</option>
      <option value="002594">比亚迪</option>
      <option value="300750">宁德时代</option>
    </select>
    <select id="periodSelect">
      <option value="daily">日线</option>
      <option value="weekly">周线</option>
      <option value="monthly">月线</option>
    </select>
    <button class="primary" onclick="loadDetail()">加载</button>
    <span id="status" class="muted">选择股票后点击加载</span>
  </div>
</div>

<div id="priceCard" class="card" style="display:none;">
  <div class="price-grid" id="priceGrid"></div>
</div>

<div class="tabs" id="tabBar" style="display:none;">
  <span class="tab active" data-tab="chart">K线走势</span>
  <span class="tab" data-tab="indicators">技术指标</span>
  <span class="tab" data-tab="info">基本信息</span>
</div>

<div class="tab-pane active" id="tabChart">
  <div class="card">
    <div id="chartWrap"></div>
  </div>
</div>
<div class="tab-pane" id="tabIndicators">
  <div class="card">
    <div class="indicator-grid" id="indicatorGrid"></div>
  </div>
</div>
<div class="tab-pane" id="tabInfo">
  <div class="card">
    <div class="info-grid" id="infoGrid"></div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const BASE = window.location.origin;
let chart = null;

document.getElementById('tabBar').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
});

function fmtMoney(n) { if (n == null) return '—'; return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtPct(n) { if (n == null) return '—'; const v = Number(n); return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

function initChart() {
  if (chart) chart.remove();
  chart = LightweightCharts.createChart(document.getElementById('chartWrap'), {
    layout: { textColor: '#7a8499', background: { type: 'solid', color: '#131a2a' } },
    grid: { vertLines: { color: 'rgba(232,236,241,0.06)' }, horzLines: { color: 'rgba(232,236,241,0.06)' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: 'rgba(232,236,241,0.1)' },
    timeScale: { borderColor: 'rgba(232,236,241,0.1)', timeVisible: true },
    watermark: { visible: true, text: '金水谣 · K线走势', color: 'rgba(255,255,255,0.04)', fontSize: 20 }
  });
}

async function loadDetail() {
  const code = document.getElementById('codeSelect').value;
  const st = document.getElementById('status');
  st.textContent = '加载中...';
  try {
    const r = await fetch(BASE + '/api/stock/detail', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const j = await r.json();
    if (j.ok) {
      const d = j.data || {};
      const a = j.analysis || {};

      renderPrice(d, a);
      renderChart(d, code);
      renderIndicators(a);
      renderInfo(d, code);
      document.getElementById('priceCard').style.display = 'block';
      document.getElementById('tabBar').style.display = 'flex';
      st.textContent = '已更新';
    } else {
      loadMock(code);
    }
  } catch (e) { loadMock(code); }
}

function renderPrice(data, analysis) {
  const grid = document.getElementById('priceGrid');
  const price = data.price || data.close || 0;
  const chg = data.change_pct || (analysis.signal || {}).score || 0;
  grid.innerHTML = [
    { label: '最新价', value: fmtMoney(price) },
    { label: '涨幅', value: fmtPct(chg), cls: chg >= 0 ? 'up' : 'down' },
    { label: '评分', value: analysis.score != null ? analysis.score.toFixed(1) : '—' },
    { label: '信号', value: analysis.signal_text || (analysis.signal || {}).direction || '—' },
  ].map(i => `<div class="price-card"><div class="price-label">${i.label}</div><div class="price-value ${i.cls || ''}">${i.value}</div></div>`).join('');
}

function renderChart(data, code) {
  initChart();
  const values = data.navs || data.candles || data.history || [];
  if (values && values.length > 0) {
    const line = chart.addLineSeries({ color: '#c8755a', lineWidth: 2, lastValueVisible: true, priceLineVisible: false });
    line.setData(values.map((v, i) => ({ time: typeof v === 'object' ? v.date : String(i), value: typeof v === 'object' ? v.close || v.price : v })));
    chart.timeScale().fitContent();
  } else {
    const mockVals = Array.from({ length: 120 }, (_, i) => 3000 + Math.sin(i * 0.1) * 200 + Math.random() * 100);
    const line = chart.addLineSeries({ color: '#c8755a', lineWidth: 2, lastValueVisible: true, priceLineVisible: false });
    const now = new Date();
    line.setData(mockVals.map((v, i) => { const d = new Date(now); d.setDate(d.getDate() - (120 - 1) + i); return { time: d.toISOString().slice(0, 10), value: v }; }));
    chart.timeScale().fitContent();
  }
}

function renderIndicators(analysis) {
  const grid = document.getElementById('indicatorGrid');
  const tech = analysis.technical || {};
  const sig = analysis.signal || {};
  const items = [];
  if (tech.ma) items.push({ name: 'MA', val: tech.ma.toFixed(2), sig: '' });
  if (tech.macd !== undefined) items.push({ name: 'MACD', val: tech.macd.toFixed(4), sig: tech.macd > 0 ? 'bull' : 'bear', sigText: tech.macd > 0 ? '多头' : '空头' });
  if (tech.kdj_k !== undefined) { const kdj = (tech.kdj_k + tech.kdj_d + tech.kdj_j) / 3; items.push({ name: 'KDJ', val: kdj.toFixed(1), sig: kdj > 80 ? 'bear' : kdj < 20 ? 'bull' : 'neutral', sigText: kdj > 80 ? '超买' : kdj < 20 ? '超卖' : '中性' }); }
  if (tech.rsi !== undefined) items.push({ name: 'RSI', val: tech.rsi.toFixed(1), sig: tech.rsi > 70 ? 'bear' : tech.rsi < 30 ? 'bull' : 'neutral', sigText: tech.rsi > 70 ? '超买' : tech.rsi < 30 ? '超卖' : '中性' });
  if (tech.boll_upper !== undefined) {
    const bw = ((tech.boll_upper - tech.boll_lower) / tech.boll_mid * 100).toFixed(1);
    items.push({ name: '布林带宽', val: bw + '%', sig: bw > 20 ? 'bear' : bw < 5 ? 'bull' : 'neutral', sigText: bw > 20 ? '宽幅' : bw < 5 ? '窄幅' : '正常' });
  }
  if (sig.direction) items.push({ name: '趋势', val: sig.direction, sig: sig.direction === 'up' ? 'bull' : sig.direction === 'down' ? 'bear' : 'neutral' });
  if (sig.strength != null) items.push({ name: '强度', val: sig.strength.toFixed(1) });

  grid.innerHTML = items.map(i => `<div class="indicator-card"><div class="indicator-name">${i.name}</div><div class="indicator-val">${i.val}</div>${i.sigText ? `<div class="indicator-sig ${i.sig || ''}">${i.sigText}</div>` : ''}</div>`).join('');
  if (items.length === 0) grid.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center;padding:20px;">暂无技术指标数据</div>';
}

function renderInfo(data, code) {
  const grid = document.getElementById('infoGrid');
  grid.innerHTML = Object.entries(data).filter(([k]) => !['navs', 'candles', 'history', 'values'].includes(k)).slice(0, 12).map(([k, v]) =>
    `<div class="info-item"><div class="info-label">${k}</div><div class="info-value">${typeof v === 'object' ? JSON.stringify(v).slice(0, 50) : v}</div></div>`
  ).join('');
  if (grid.innerHTML === '') grid.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center;padding:20px;">暂无详细数据</div>';
}

function loadMock(code) {
  initChart();
  const basePrice = code === '000001' ? 3200 : code === '000300' ? 4200 : code === '600519' ? 1800 : 50 + Math.random() * 100;
  const days = 120;
  const now = new Date();
  const vals = Array.from({ length: days }, (_, i) => basePrice + Math.sin(i * 0.08) * basePrice * 0.05 + Math.random() * basePrice * 0.02);
  const candles = vals.map((v, i) => { const d = new Date(now); d.setDate(d.getDate() - (days - 1) + i); return { time: d.toISOString().slice(0, 10), value: v }; });
  const line = chart.addLineSeries({ color: '#c8755a', lineWidth: 2, lastValueVisible: true, priceLineVisible: false });
  line.setData(candles);
  chart.timeScale().fitContent();

  document.getElementById('priceGrid').innerHTML = [
    { label: '最新价', value: fmtMoney(vals[vals.length - 1]) },
    { label: '涨幅', value: '+1.25%', cls: 'up' },
    { label: '评分', value: '65.0' },
    { label: '信号', value: '中性' },
  ].map(i => `<div class="price-card"><div class="price-label">${i.label}</div><div class="price-value ${i.cls || ''}">${i.value}</div></div>`).join('');
  document.getElementById('priceCard').style.display = 'block';
  document.getElementById('tabBar').style.display = 'flex';
  document.getElementById('indicatorGrid').innerHTML = [
    { name: 'MA', val: vals[vals.length - 1].toFixed(2) }, { name: 'MACD', val: '0.0023', sigText: '多头', sig: 'bull' },
    { name: 'KDJ', val: '58.3', sigText: '中性', sig: 'neutral' }, { name: 'RSI', val: '55.2', sigText: '中性', sig: 'neutral' },
    { name: '趋势', val: '震荡上行' }, { name: '强度', val: '42.5' },
  ].map(i => `<div class="indicator-card"><div class="indicator-name">${i.name}</div><div class="indicator-val">${i.val}</div>${i.sigText ? `<div class="indicator-sig ${i.sig || ''}">${i.sigText}</div>` : ''}</div>`).join('');
  document.getElementById('infoGrid').innerHTML = `<div class="info-item"><div class="info-label">代码</div><div class="info-value">${code}</div></div>`;
  document.getElementById('status').textContent = '模拟数据';
}

loadDetail();
window.addEventListener('resize', () => { if (chart) chart.resize(chart.chartElement().clientWidth, 400); });
</script>
  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/topnav.js"></script>
</body>
</html>

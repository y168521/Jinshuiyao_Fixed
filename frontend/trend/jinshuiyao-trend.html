  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --primary: #00d4aa;
      --danger: #C8755A;
      --gold: #ffd93d;
      --blue: #5BC0DE;
      --purple: #b197fc;
      --text: #e4e8f1;
      --muted: #7a8499;
      --border: #1e2a40;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
    }
    .header {
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header .time { color: var(--muted); font-size: 0.85rem; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 0.7rem 1.2rem;
      font-size: 0.88rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    /* Chart cards */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .chart-card .title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chart-card .title .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .chart-box { width: 100%; min-height: 350px; }
    .chart-box-tall { min-height: 450px; }
    .chart-box-short { min-height: 280px; }

    .panel { display: none; }
    .panel.active { display: block; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

    /* Badge */
    .badge {
      display: inline-block;

      padding: 0.15rem 0.5rem;

      font-weight: 700;

    .badge-warm { background: rgba(255,217,61,0.15); color: var(--gold); }
    .badge-cold { background: rgba(96,165,250,0.15); color: var(--blue); }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .chart-box { min-height: 280px; }
    }

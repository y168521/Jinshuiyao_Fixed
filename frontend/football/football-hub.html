<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金水谣 · 足彩分析中心</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  :root { --bg:var(--deep); --card:var(--card-bg); --border:var(--gold-border); --txt:var(--ink); --muted:var(--ink-dim); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); padding:24px; max-width:960px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .back { margin-bottom:16px; }
  .back a { color:var(--muted); font-size:13px; text-decoration:none; }
  .back a:hover { color:var(--gold); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:700px){ .grid{ grid-template-columns:1fr; } body{ padding:16px; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-decoration:none; color:var(--txt); display:flex; flex-direction:column; transition:.15s; }
  .card:hover { border-color:var(--gold); transform:translateY(-2px); }
  .card-icon { font-size:28px; margin-bottom:6px; }
  .card h2 { font-size:15px; margin:0 0 4px; }
  .card p { font-size:12px; color:var(--muted); margin:0; line-height:1.5; }
  .tag { display:inline-block; padding:1px 8px; border-radius:8px; font-size:11px; background:rgba(212,175,55,.12); color:var(--gold); margin-top:8px; align-self:flex-start; }
  .section-title { font-size:13px; color:var(--muted); margin:20px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px; }
</style>
</head>
<body>
<div class="back"><a href="/control-center">&#8592; 返回控制中心</a></div>
<h1>足彩分析中心</h1>
<div class="sub">赛事数据、AI预测、赔率分析 — 仅供参考，不保证结果</div>

<div class="section-title">&#9917; 核心功能</div>
<div class="grid">
  <a class="card" href="/football/dashboard">
    <div class="card-icon">&#128200;</div>
    <h2>足彩仪表盘</h2>
    <p>AI赛前模拟、数据对比、晋级路径 — 综合看板</p>
    <span class="tag">全景·分析·决策</span>
  </a>
  <a class="card" href="/football/matches">
    <div class="card-icon">&#128195;</div>
    <h2>比赛列表</h2>
    <p>各大联赛赛事浏览 — 赔率对比、赛程安排、点击进入分析</p>
    <span class="tag">赛程·赔率·浏览</span>
  </a>
  <a class="card" href="/football/predict">
    <div class="card-icon">&#128270;</div>
    <h2>赛事预测</h2>
    <p>AI赛事分析 — 概率估算、比分路径推演、投注参考</p>
    <span class="tag">预测·概率·比分</span>
  </a>
</div>
</body>
</html>

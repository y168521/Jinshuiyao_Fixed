<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学模型选号 · 六维分析</title>
<link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
<style>
  .lot-tabs { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  .lot-tabs button { padding:8px 16px; border:1px solid var(--border,#ddd); background:var(--card,#fff); border-radius:8px; cursor:pointer; font-size:14px; }
  .lot-tabs button.active { background:var(--accent,#4a90d9); color:#fff; border-color:var(--accent,#4a90d9); }
  .method { background:var(--card,#fff); border:1px solid var(--border,#eee); border-radius:10px; padding:14px; margin-top:14px; }
  .method h3 { margin:0 0 8px; font-size:15px; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; font-size:13px; border-bottom:1px dashed var(--border,#eee); }
  .kv span:last-child { font-weight:600; }
  .tickets { max-height:260px; overflow:auto; font-family:var(--font-mono, monospace); font-size:13px; line-height:1.7; }
  .warn { margin-top:12px; font-size:12px; color:#a1202a; background:#fdf0f0; border:1px solid #f3c9c9; border-radius:8px; padding:10px 12px; }
  .note { margin-top:12px; font-size:12px; color:#888; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; background:var(--accent,#4a90d9); color:#fff; margin-left:6px; }
  .err { color:#a1202a; }
  @media (max-width:720px){ .tickets{ max-height:200px; } }
</style>
</head>
<body>
<div class="container">
  <h2>数学模型选号 · 六维分析</h2>
  <p class="note">组合数学 / 统计推断 / 蒙特卡洛 / 时间序列 / 误差分析 / 偏离波动。所有方法仅用于历史筛选、纪律化缩水、策略证伪，<b>不预测中奖</b>；每注中奖概率恒等于随机基准。</p>
  <div class="lot-tabs" id="tabs"></div>
  <div id="out"></div>
  <div class="warn" id="honest"></div>
</div>
<script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/topnav.js" defer></script>
<script>
const $ = (s) => document.querySelector(s);
const LOTS = ["大乐透","双色球","福彩3D","排列三","七乐彩","快乐8"];
let cur = "大乐透";

const tabs = $("#tabs");
LOTS.forEach(l => {
  const b = document.createElement("button");
  b.textContent = l; b.dataset.lot = l;
  if (l === cur) b.classList.add("active");
  b.onclick = () => { cur = l; [...tabs.children].forEach(x=>x.classList.remove("active")); b.classList.add("active"); load(l); };
  tabs.appendChild(b);
});

function kv(k, v){ return '<div class="kv"><span>'+k+'</span><span>'+(v??'-')+'</span></div>'; }

function renderMethod(name, m){
  let html = '<div class="method"><h3>'+name+'<span class="pill">方法</span></h3>';
  if (name === "组合数学" && m){
    html += kv("候选池组合数", m.total_combos) + kv("保留注数", m.kept) + kv("预算", m.budget) + kv("是否截断", m.truncated ? "是(已截断)" : "否");
    html += '<div class="tickets">'+(m.tickets.slice(0,60).map(t=>t).join("<br>"))+(m.tickets.length>60?"<br>…(共"+m.tickets.length+"注)":"")+'</div>';
    html += '<div class="note">'+m.note+'</div>';
  } else if (name === "统计推断" && m){
    const c = m.chi2_uniform;
    html += kv("χ²统计量", c.chi2) + kv("自由度", c.df) + kv("p值", c.p_value) + kv("是否均匀", c.uniform ? "是(符合随机)" : "否");
    html += '<div class="note">'+c.note+'</div>';
    const z = m.zscore_deviation;
    html += kv("偏离均值", z.mean) + kv("标准差", z.std) + kv("|z|>2的号", "["+z.extreme.join(",")+"]");
    html += '<div class="note">'+z.note+'</div>';
  } else if (name === "时间序列" && m){
    html += kv("平稳性", m.stationary ? "平稳(无规律)" : "存疑");
    html += kv("显著滞后", "["+(m.significant_lags||[]).join(",")+"]");
    html += kv("ACF阈值", m.threshold);
    html += '<div class="note">'+m.note+'</div>';
  } else if (name === "蒙特卡洛" && m){
    html += kv("策略命中率", m.strategy_hit_rate) + kv("随机基线", m.random_baseline_rate) + kv("增益", m.gain);
    html += '<div class="note">'+m.note+'</div>';
  } else if (name === "误差校准" && m){
    html += kv("命中分布", JSON.stringify(m.hit_distribution));
    html += '<div class="note">'+m.note+'</div>';
  }
  html += '</div>';
  return html;
}

const NAME_MAP = {combinatorics:"组合数学", stats:"统计推断", timeseries:"时间序列", montecarlo:"蒙特卡洛", calibration:"误差校准"};
async function load(lot){
  $("#out").innerHTML = '加载中…';
  try {
    const r = await fetch('/api/lottery/math-model?lot=' + encodeURIComponent(lot));
    const d = await r.json();
    if (!d.ok){ $("#out").innerHTML = '<span class="err">错误：'+(d.error||'未知')+'</span>'; return; }
    let h = '';
    for (const key of ["combinatorics","stats","timeseries","montecarlo","calibration"]){
      if (d.methods && d.methods[key]) h += renderMethod(NAME_MAP[key], d.methods[key]);
    }
    $("#out").innerHTML = h;
    const meta = d.meta || {};
    $("#honest").textContent = (meta.honest_note||'') + ' 历史期数：' + (meta.n_periods||'?');
  } catch(e){
    $("#out").innerHTML = '<span class="err">请求失败：'+e.message+'（需金水谣服务在18888运行）</span>';
  }
}
load(cur);
</script>
</body>
</html>

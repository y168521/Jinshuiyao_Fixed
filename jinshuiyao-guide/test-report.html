<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金水谣万物引擎 - 测试报告</title>
  <link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
  <style>
    /* @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap'); */
    :root {
      /* 映射到 theme.css 设计令牌 */
      --bg: var(--deep);
      --bg2: var(--card-bg);
      --bg3: #1c3350;
      --dim: var(--ink-mid);
      --rule: var(--gold-border);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 800px 600px at 15% 20%, rgba(91,192,222,0.06), transparent),
        radial-gradient(ellipse 600px 500px at 85% 70%, rgba(91,192,222,0.05), transparent),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(201,169,110,0.03), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 2rem 3rem;
    }

    /* 顶部 */
    .hero {
      text-align: center;
      padding: 2rem 0 1rem;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(45,139,126,0.12);
      border: 1px solid rgba(45,139,126,0.25);
      border-radius: 20px;
      padding: 0.2rem 1rem;
      font-size: 0.75rem;
      color: var(--ok);
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
      font-weight: 500;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, var(--ok), var(--accent), var(--warn));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-time {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.3rem;
    }

    /* 新手提示 */
    .tip-banner {
      background: rgba(45,139,126,0.08);
      border: 1px solid rgba(45,139,126,0.2);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0 2rem;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .tip-banner strong { color: var(--ok); }

    /* 通过率环形图区域 */
    .rate-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    .ring-chart {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .ring-chart svg {
      transform: rotate(-90deg);
    }
    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring-percent {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }
    .ring-percent.high { color: var(--ok); }
    .ring-percent.medium { color: var(--warn); }
    .ring-percent.low { color: var(--err); }
    .ring-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
    .stats-box {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1rem;
    }
    .stat-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-dot.pass { background: var(--ok); }
    .stat-dot.fail { background: var(--err); }
    .stat-dot.skip { background: var(--dim); }
    .stat-num {
      font-weight: 700;
      font-size: 1.3rem;
      margin-left: auto;
      min-width: 30px;
      text-align: right;
    }
    .stat-num.pass { color: var(--ok); }
    .stat-num.fail { color: var(--err); }
    .stat-num.skip { color: var(--dim); }

    /* 测试列表 */
    .test-list-section {
      margin: 2rem 0;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--ink);
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--rule);
    }
    .test-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      font-size: 0.88rem;
    }
    .test-item:hover {
      border-color: rgba(91,192,222,.3);
    }
    .test-status {
      font-size: 1.1rem;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }
    .test-item.pass { border-left: 3px solid var(--ok); }
    .test-item.fail { border-left: 3px solid var(--err); }
    .test-item.skip { border-left: 3px solid var(--dim); }
    .test-name {
      flex: 1;
      font-family: 'Courier New', monospace;
      color: var(--ink);
    }
    .test-duration {
      color: var(--dim);
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    /* 原始日志 */
    .log-section {
      margin: 2rem 0;
    }
    .log-toggle {
      padding: 0.5rem 1rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--bg3);
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .log-toggle:hover {
      border-color: var(--accent);
      color: var(--ink);
    }
    .log-content {
      background: #0d1117;
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 1rem;
      display: none;
      white-space: pre-wrap;
      color: #e6edf3;
    }
    .log-content.visible { display: block; }

    /* 操作按钮 */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.65rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--ok);
      color: var(--bg);
    }
    .btn-primary:hover { background: #2D8B7E; }
    .btn-ghost {
      background: var(--bg3);
      color: var(--muted);
      border: 1px solid var(--rule);
    }
    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--ink);
    }
    .btn .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 底部 */
    .footer-bar {
      text-align: center;
      padding: 2rem 0 0;
      border-top: 1px solid var(--rule);
      margin-top: 2rem;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--accent); }
    .footer-copy {
      color: var(--dim);
      font-size: 0.75rem;
    }

    @media (max-width: 768px) {
      .container { padding: 1.25rem; }
      .hero h1 { font-size: 1.6rem; }
      .rate-section { gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部 -->
    <div class="hero">
      <div class="hero-badge">测试报告</div>
      <h1>金水谣万物引擎 · 测试报告</h1>
      <div class="hero-time" id="heroTime">最后测试时间：加载中...</div>
    </div>

    <!-- 新手提示 -->
    <div class="tip-banner">
      <strong>新手提示：</strong>这里是系统自动化测试的结果报告。<strong>绿色</strong>表示测试通过，<strong>红色</strong>表示测试失败，<strong>灰色</strong>表示跳过。点击"重新运行测试"可以立即执行所有测试并查看最新结果。
    </div>

    <!-- 通过率环形图 + 统计 -->
    <div class="rate-section">
      <div class="ring-chart">
        <!-- SVG环形图 -->
        <svg width="180" height="180" viewBox="0 0 180 180">
          <!-- 背景圆环 -->
          <circle cx="90" cy="90" r="72" fill="none" stroke="#1f2937" stroke-width="14"/>
          <!-- 通过率圆环（动态更新） -->
          <circle id="ringPass" cx="90" cy="90" r="72" fill="none"
            stroke="#2D8B7E" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="0 452.39" stroke-dashoffset="0"/>
          <!-- 失败率圆环 -->
          <circle id="ringFail" cx="90" cy="90" r="72" fill="none"
            stroke="#C8755A" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="0 452.39" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-text">
          <div class="ring-percent" id="ratePercent">--%</div>
          <div class="ring-label">通过率</div>
        </div>
      </div>
      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-dot pass"></span>
          <span>通过</span>
          <span class="stat-num pass" id="passCount">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-dot fail"></span>
          <span>失败</span>
          <span class="stat-num fail" id="failCount">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-dot skip"></span>
          <span>跳过</span>
          <span class="stat-num skip" id="skipCount">0</span>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <button class="btn btn-primary" id="btnRunTests" onclick="runTests()">&#9654; 重新运行测试</button>
      <button class="btn btn-ghost" onclick="exportReport()">&#128196; 导出报告</button>
      <button class="btn btn-ghost" onclick="window.location.href='/'">&#128682; 返回总控台</button>
    </div>

    <!-- 测试列表 -->
    <div class="test-list-section">
      <div class="section-title">&#128203; 测试用例详情</div>
      <div id="testList">
        <div style="text-align:center;color:var(--muted);padding:2rem;">正在加载测试数据...</div>
      </div>
    </div>

    <!-- 原始日志 -->
    <div class="log-section">
      <button class="log-toggle" id="logToggle" onclick="toggleLog()">&#128221; 查看原始日志</button>
      <div class="log-content" id="logContent"></div>
    </div>

    <!-- 底部 -->
    <div class="footer-bar">
      <div class="footer-links">
        <a href="/">返回总控台</a>
        <a href="/docs">接口文档</a>
        <a href="/ai-test">AI用例</a>
      </div>
      <div class="footer-copy">
        金水谣万物引擎 &copy; 2026 | 测试报告 v1.0 | 服务器端口 18888
      </div>
    </div>
  </div>

  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/toast.js"></script>
<script>
    // ===== 当前测试数据（全局变量）=====
    var currentLogContent = '';

    // ===== 页面加载时获取测试结果 =====
    async function loadTestResults() {
      try {
        var res = await fetch('/api/test-results');
        var data = await res.json();
        displayResults(data);
      } catch (err) {
        // 网络错误时显示提示
        document.getElementById('testList').innerHTML =
          '<div style="text-align:center;color:var(--err);padding:2rem;">' +
          '无法连接到服务器，请确认导航服务器已启动。<br>' +
          '<span style="color:var(--muted);font-size:0.82rem;">错误：' + err.message + '</span></div>';
      }
    }

    // ===== 解析测试日志并显示结果 =====
    function displayResults(data) {
      var log = data.log || '';
      var testTime = data.time || 0;
      currentLogContent = log;

      // 显示最后测试时间
      var timeStr = '暂无测试记录';
      if (testTime > 0) {
        var d = new Date(testTime * 1000);
        timeStr = d.getFullYear() + '-' +
          String(d.getMonth()+1).padStart(2,'0') + '-' +
          String(d.getDate()).padStart(2,'0') + ' ' +
          String(d.getHours()).padStart(2,'0') + ':' +
          String(d.getMinutes()).padStart(2,'0') + ':' +
          String(d.getSeconds()).padStart(2,'0');
      }
      document.getElementById('heroTime').textContent = '最后测试时间：' + timeStr;

      // 设置原始日志
      document.getElementById('logContent').textContent = log;

      // 解析日志中的测试结果
      var lines = log.split('\n');
      var testItems = [];
      var passCount = 0;
      var failCount = 0;
      var skipCount = 0;

      // 匹配常见的测试输出格式
      // 格式1: "PASS test_xxx" / "FAIL test_xxx" / "SKIP test_xxx"
      // 格式2: "test_xxx ... ok" / "test_xxx ... FAIL"
      lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;

        var match;

        // 格式1: PASS/FAIL/SKIP 前缀
        if ((match = line.match(/^(PASS|OK|pass)\s+(.+)$/i))) {
          testItems.push({ status: 'pass', name: match[2].trim() });
          passCount++;
        } else if ((match = line.match(/^(FAIL|ERROR|fail)\s+(.+)$/i))) {
          testItems.push({ status: 'fail', name: match[2].trim() });
          failCount++;
        } else if ((match = line.match(/^(SKIP|skip|xfail)\s+(.+)$/i))) {
          testItems.push({ status: 'skip', name: match[2].trim() });
          skipCount++;
        }
        // 格式2: pytest风格 "test_xxx ... ok/FAIL/PASSED"
        else if ((match = line.match(/^(test_\S+)\s+\.\.\.\s+(ok|passed|PASSED)/i))) {
          testItems.push({ status: 'pass', name: match[1] });
          passCount++;
        } else if ((match = line.match(/^(test_\S+)\s+\.\.\.\s+(FAIL|ERROR|FAILED)/i))) {
          testItems.push({ status: 'fail', name: match[1] });
          failCount++;
        }
        // 格式3: 冒烟测试行 "--- PASS: xxx"
        else if ((match = line.match(/^---\s+PASS:\s*(.+)$/))) {
          testItems.push({ status: 'pass', name: match[1].trim() });
          passCount++;
        } else if ((match = line.match(/^---\s+FAIL:\s*(.+)$/))) {
          testItems.push({ status: 'fail', name: match[1].trim() });
          failCount++;
        }
        // 格式4: 冒烟测试行 "[PASS] xxx" / "[FAIL] xxx"
        else if ((match = line.match(/^\[PASS\]\s*(.+)$/))) {
          testItems.push({ status: 'pass', name: match[1].trim() });
          passCount++;
        } else if ((match = line.match(/^\[FAIL\]\s*(.+)$/))) {
          testItems.push({ status: 'fail', name: match[1].trim() });
          failCount++;
        }
      });

      // 如果没有解析到任何测试项，但日志不为空，显示一个总览项
      var total = passCount + failCount + skipCount;
      if (total === 0 && log && log.indexOf('暂无') === -1) {
        testItems.push({ status: log.indexOf('错误') !== -1 || log.indexOf('FAIL') !== -1 || log.indexOf('Error') !== -1 ? 'fail' : 'pass', name: '整体测试（详见原始日志）' });
        if (log.indexOf('错误') !== -1 || log.indexOf('FAIL') !== -1 || log.indexOf('Error') !== -1) {
          failCount = 1;
        } else {
          passCount = 1;
        }
        total = 1;
      }

      // 更新统计数字
      document.getElementById('passCount').textContent = passCount;
      document.getElementById('failCount').textContent = failCount;
      document.getElementById('skipCount').textContent = skipCount;

      // 更新环形图
      updateRingChart(total > 0 ? passCount / total : 0, total > 0 ? failCount / total : 0);

      // 渲染测试列表
      renderTestList(testItems);
    }

    // ===== 更新SVG环形图 =====
    function updateRingChart(passRate, failRate) {
      var circumference = 2 * Math.PI * 72; // 圆周长
      var passLen = passRate * circumference;
      var failLen = failRate * circumference;

      var ringPass = document.getElementById('ringPass');
      var ringFail = document.getElementById('ringFail');

      // 通过部分（绿色）
      ringPass.setAttribute('stroke-dasharray', passLen + ' ' + (circumference - passLen));
      ringPass.setAttribute('stroke-dashoffset', '0');

      // 失败部分（红色，偏移到通过部分之后）
      ringFail.setAttribute('stroke-dasharray', failLen + ' ' + (circumference - failLen));
      ringFail.setAttribute('stroke-dashoffset', '-' + passLen);

      // 更新百分比文字
      var percent = Math.round(passRate * 100);
      var el = document.getElementById('ratePercent');
      el.textContent = percent + '%';
      el.className = 'ring-percent ' + (percent >= 80 ? 'high' : percent >= 50 ? 'medium' : 'low');
    }

    // ===== 渲染测试列表 =====
    function renderTestList(items) {
      var container = document.getElementById('testList');
      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem;">暂无测试数据，点击"重新运行测试"执行首次测试。</div>';
        return;
      }
      var html = '';
      items.forEach(function(item) {
        var icon = item.status === 'pass' ? '&#9989;' : item.status === 'fail' ? '&#10060;' : '&#9203;';
        html += '<div class="test-item ' + item.status + '">';
        html += '<span class="test-status">' + icon + '</span>';
        html += '<span class="test-name">' + escapeHtml(item.name) + '</span>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    // ===== HTML转义 =====
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ===== 重新运行测试 =====
    async function runTests() {
      var btn = document.getElementById('btnRunTests');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 测试运行中，请稍候...';

      try {
        var res = await fetch('/api/run-tests', { method: 'POST', headers: {'Content-Type': 'application/json'} });
        var data = await res.json();

        // 如果有stdout就用stdout作为日志，否则合并
        var log = data.stdout || '';
        if (data.stderr) {
          log += (log ? '\n\n' : '') + data.stderr;
        }
        if (data.returncode !== undefined) {
          log += (log ? '\n\n' : '') + '退出码: ' + data.returncode;
        }

        displayResults({ log: log, time: Math.floor(Date.now() / 1000) });
        showToast('测试完成！退出码: ' + data.returncode, data.returncode === 0 ? 'success' : 'error');
      } catch (err) {
        showToast('运行测试失败: ' + err.message, 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '&#9654; 重新运行测试';
    }

    // ===== 导出报告 =====
    function exportReport() {
      // 生成Markdown格式的报告并下载
      var passCount = document.getElementById('passCount').textContent;
      var failCount = document.getElementById('failCount').textContent;
      var skipCount = document.getElementById('skipCount').textContent;
      var total = parseInt(passCount) + parseInt(failCount) + parseInt(skipCount);
      var rate = total > 0 ? Math.round(parseInt(passCount) / total * 100) : 0;
      var timeStr = document.getElementById('heroTime').textContent;

      var md = '# 金水谣万物引擎 测试报告\n\n';
      md += '- ' + timeStr + '\n';
      md += '- 通过率: ' + rate + '%\n';
      md += '- 通过: ' + passCount + ' | 失败: ' + failCount + ' | 跳过: ' + skipCount + '\n\n';
      md += '## 原始日志\n\n```\n' + currentLogContent + '\n```\n';

      // 创建下载
      var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'test-report-' + new Date().toISOString().slice(0,10) + '.md';
      a.click();
      URL.revokeObjectURL(url);
      showToast('报告已导出', 'success');
    }

    // ===== 切换日志显示 =====
    function toggleLog() {
      var content = document.getElementById('logContent');
      var btn = document.getElementById('logToggle');
      if (content.classList.contains('visible')) {
        content.classList.remove('visible');
        btn.textContent = '\uD83D\uDCDD 查看原始日志';
      } else {
        content.classList.add('visible');
        btn.textContent = '\uD83D\uDCDD 隐藏原始日志';
      }
    }

    // ===== Toast提示 =====
    

    // 页面加载时获取数据
    loadTestResults();

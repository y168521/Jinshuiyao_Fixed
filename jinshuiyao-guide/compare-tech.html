<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技术方案对比 - 金水谣</title>
  <link rel="stylesheet" href="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/css/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font, 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif);
      background: var(--deep, #0B1A2F);
      color: var(--ink, #E8ECF1);
      line-height: 1.6;
      min-height: 100vh;
    }
    .back {
      display: inline-block;
      margin: 1rem 0 .2rem;
      color: rgba(232,236,241,.6);
      text-decoration: none;
      font-size: .9rem;
    }
    .back:hover { color: #C9A96E; }
  </style>
</head>
<body data-nav="bar">
  <div class="cu-app">
    <a class="back" href="/">← 返回门户</a>
    <div id="app">加载中…</div>
  </div>

  <!-- 统一顶栏（自动注入，bar 模式） -->
  <script src="/Jinshuiyao_Fixed/jinshuiyao-guide/_shared/js/topnav.js"></script>
  <!-- 复用：通用对比表格工具 -->
  <script src="_shared/js/compare-utils.js"></script>
  <script>
    (function () {
      // 相对路径：页面由服务器以 /Jinshuiyao_Fixed/jinshuiyao-guide/ 前缀提供时，
      // 自动解析到同目录下的 data/tech-solutions.json（同源，不受跨域影响）。
      var DATA_URL = "data/tech-solutions.json";
      var app = document.getElementById("app");
      function showError(msg) {
        app.innerHTML = "<p class='cu-error'>" + msg + "</p>";
      }
      // 防呆：直接双击本地文件(file://)打开时，浏览器会拦截对 http 服务的 fetch，
      // 此时给出明确指引，而不是笼统的 "Failed to fetch"。
      if (location.protocol === "file:") {
        showError("⚠️ 此页面需通过服务器打开，不能直接双击本地文件。<br><br>" +
          "正确方式：在浏览器地址栏访问<br>" +
          "<code>http://127.0.0.1:18888/Jinshuiyao_Fixed/jinshuiyao-guide/compare-tech.html</code><br><br>" +
          "（确认金水谣服务已在 18888 端口运行；双击本地文件会被浏览器的安全策略拦截数据加载。）");
        return;
      }
      fetch(DATA_URL)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          if (!data || !data.solutions || !data.solutions.length) {
            showError("对比数据为空，请运行 tools/gen_tech_solutions.py 生成 data/tech-solutions.json。");
            return;
          }
          CompareUtils.mount(app, data, { filter: true, sortable: true });
        })
        .catch(function (e) {
          showError("加载对比数据失败：" + e.message +
            "<br>请确认：①金水谣服务在 18888 端口运行；②已执行 <code>python3 tools/gen_tech_solutions.py</code> 生成 data/tech-solutions.json；" +
            "③通过 <code>http://127.0.0.1:18888/...</code> 服务器地址打开本页面（勿双击本地文件）。");
        });
    })();
  </script>
</body>
</html>
